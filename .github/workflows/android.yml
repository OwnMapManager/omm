# Buduje aplikację OMM na Androida (plik APK) w chmurze GitHuba.
# Uruchamia się sama po każdej zmianie w repozytorium, a także ręcznie:
# zakładka Actions → „Zbuduj APK” → Run workflow.
# Gotowy plik trafia do zakładki Releases (np. „OMM v33” → omm-v33.apk).
#
# Bezpieczeństwo procesu (audyt v45, R04/R05):
#  • klucz podpisu wyłącznie z sekretu (sprawdzany odcisk certyfikatu),
#  • akcje przypięte do konkretnych commitów (pełny SHA), nie do ruchomych tagów,
#  • budowanie ma tylko prawo odczytu repozytorium; prawo zapisu (publikacja wydania) ma osobne zadanie,
#    które nie uruchamia żadnego kodu projektu ani zależności,
#  • zależności npm instalowane bez ich skryptów instalacyjnych (--ignore-scripts),
#  • klucz podpisu i hasło trafiają wyłącznie do kroku Gradle (nie do całego środowiska zadania).
name: Zbuduj APK

on:
  push:
    branches: [main]
    # same zmiany w dokumentacji i testach nie budują nowego APK (wydanie zostaje bajtowo to samo)
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - '**/*.md'
  workflow_dispatch:

permissions: {}

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - name: Pobierz kod
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Java 21 (wymagana przez Capacitor 8)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Zależności (bez skryptów instalacyjnych paczek) i poprawka Capacitora
        run: |
          npm ci --ignore-scripts
          node scripts/patch-capacitor.mjs
          grep -q "OMM-R07" node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/CapacitorWebView.java

      - name: Przygotuj aplikację (www/) i przenieś ją do projektu Android
        id: ver
        run: |
          npm run www
          npx cap sync android
          echo "ver=$(cat www/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Zbuduj i podpisz APK
        working-directory: android
        env:
          KEY_B64: ${{ secrets.OMM_KEYSTORE_B64 }}
          OMM_KEYSTORE_PASSWORD: ${{ secrets.OMM_KEYSTORE_PASSWORD }}
          VER: ${{ steps.ver.outputs.ver }}
        run: |
          if [ -z "$OMM_KEYSTORE_PASSWORD" ]; then
            echo "::error::Brak sekretu OMM_KEYSTORE_PASSWORD. Bez stałego klucza każda wersja wymagałaby odinstalowania poprzedniej (utrata danych w telefonie), więc budowanie zostaje przerwane."
            exit 1
          fi
          # klucz podpisu tylko z sekretu OMM_KEYSTORE_B64 (nie ma go w repozytorium)
          if [ -z "$KEY_B64" ]; then
            echo "::error::Brak sekretu OMM_KEYSTORE_B64 (klucz podpisu zakodowany base64)."
            exit 1
          fi
          printf '%s' "$KEY_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/omm-release.p12"
          export OMM_KEYSTORE_FILE="$RUNNER_TEMP/omm-release.p12"
          # diagnostyka bez ujawniania tajemnic: rozmiar i suma zaszyfrowanego pliku (ta sama co publiczny plik z historii repozytorium)
          echo "Klucz z sekretu: $(stat -c %s "$OMM_KEYSTORE_FILE") B, sha256 $(sha256sum "$OMM_KEYSTORE_FILE" | cut -c1-16)… (oczekiwane 4306 B, 1e7acf93c3de0143…)"
          keytool -list -storetype PKCS12 -keystore "$OMM_KEYSTORE_FILE" -storepass "$OMM_KEYSTORE_PASSWORD" >/dev/null 2>"$RUNNER_TEMP/kt.err" || { echo "::error::keytool: $(grep -v JAVA_TOOL "$RUNNER_TEMP/kt.err" | head -3 | tr '\n' ' ')"; }
          # ten sam klucz co dotąd – inaczej aktualizacja na telefonie byłaby niemożliwa
          FP=$(keytool -list -v -storetype PKCS12 -keystore "$OMM_KEYSTORE_FILE" -storepass "$OMM_KEYSTORE_PASSWORD" | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$FP" != "0329e7be9bc9226f7033f2fc9939e784ac540ce425d10cfe0ec9e05ddedb17ac" ]; then
            echo "::error::Klucz z sekretu ma inny odcisk ($FP) niż klucz OMM – sprawdź sekret OMM_KEYSTORE_B64. Plik: $(stat -c %s "$OMM_KEYSTORE_FILE") B, sha256 $(sha256sum "$OMM_KEYSTORE_FILE" | cut -c1-16)"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/omm-release.p12"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/omm-v$VER.apk"
          sha256sum "$GITHUB_WORKSPACE/omm-v$VER.apk" | tee "$GITHUB_WORKSPACE/omm-v$VER.apk.sha256"

      - name: Zachowaj plik (Actions → ten przebieg → Artifacts)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omm-v${{ steps.ver.outputs.ver }}
          path: |
            omm-v${{ steps.ver.outputs.ver }}.apk
            omm-v${{ steps.ver.outputs.ver }}.apk.sha256

  wydanie:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # tylko to zadanie publikuje wydanie (Releases)
    steps:
      - name: Pobierz zbudowany APK
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: omm-v${{ needs.apk.outputs.ver }}

      - name: Opublikuj wydanie (Releases)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.apk.outputs.ver }}
          name: OMM v${{ needs.apk.outputs.ver }}
          files: |
            omm-v${{ needs.apk.outputs.ver }}.apk
            omm-v${{ needs.apk.outputs.ver }}.apk.sha256
          make_latest: true
          body: |
            OMM – Own Map Manager, wersja v${{ needs.apk.outputs.ver }}.
            Instalacja: pobierz plik omm-v${{ needs.apk.outputs.ver }}.apk na telefonie i otwórz go.
            Aktualizacja: zainstaluj nowszy plik na starą wersję – dane zostają.
            Suma SHA-256 pliku: omm-v${{ needs.apk.outputs.ver }}.apk.sha256
