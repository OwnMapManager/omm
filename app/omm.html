<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Polityka bezpieczeństwa treści: skrypty i style tylko z aplikacji (oraz Leaflet z cdnjs w wersji przeglądarkowej),
     zakaz ramek, wtyczek i obcych formularzy. Obrazki i zapytania – do serwerów map (różne adresy). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src * data: blob:; media-src * data: blob:; connect-src * data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; child-src 'none'; base-uri 'none'; form-action 'none'">
<title>OMM – Own Map Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root {
  --bar: rgba(255, 255, 255, 0.97);
  --b2: #f1f3f4;
  --line: #dadce0;
  --acc: #1a73e8;
  --accbg: #e8f0fe;
  --txt: #202124;
  --sub: #5f6368;
  --sa: env(safe-area-inset-bottom, 0px);
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
  font:
    13px system-ui,
    sans-serif;
  color: var(--txt);
}
button,
select,
input,
textarea {
  font: inherit;
  color: inherit;
}
#map {
  position: absolute;
  inset: 0;
  background-color: #e8eaed;
  background-image:
    linear-gradient(#d2d6db 1px, transparent 1px), linear-gradient(90deg, #d2d6db 1px, transparent 1px);
  background-size: 40px 40px;
}
.leaflet-bottom {
  bottom: calc(50px + var(--sa));
}
.leaflet-left {
  left: 4px;
}
.leaflet-control-attribution {
  font-size: 9px !important;
}
.ib {
  position: absolute;
  z-index: 1000;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: var(--bar);
  color: var(--txt);
  font-size: 17px;
  padding: 0;
  box-shadow: 0 1px 4px #0005;
}
/* górne przyciski w stylu paska narzędzi: czarne ikony na białym kole */
#bbtn {
  top: calc(8px + env(safe-area-inset-top, 0px));
  right: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  color: #202124;
}
#bbtn svg {
  width: 33px;
  height: 18px;
  display: block;
  margin-top: 1px;
}
#bbtn span {
  font-size: 9px;
  font-weight: 700;
  line-height: 10px;
}
#gps svg,
#prnb svg {
  width: 22px;
  height: 22px;
  display: block;
  margin: auto;
  color: #202124;
}
#gps {
  top: calc(56px + env(safe-area-inset-top, 0px));
  right: 8px;
}
#prnb {
  top: calc(104px + env(safe-area-inset-top, 0px));
  right: 8px;
}
#srchb svg {
  width: 22px;
  height: 22px;
}
#srchb {
  left: 8px;
  bottom: calc(70px + var(--sa)); /* nad przyciskiem warstw i podpisem podkładu */
}
#lbtn.work {
  background: var(--acc);
  color: #fff;
}
#modeb {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 14px;
  padding: 4px 10px;
  font-size: 12px;
  white-space: nowrap;
  flex: none;
}
#setb {
  border: 0;
  background: none;
  font-size: 18px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  flex: none;
  padding: 0;
}
#modeb.work {
  background: var(--accbg);
  color: var(--acc);
  border-color: var(--acc);
  font-weight: 700;
}
#selbar,
#tselbar {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 8px 10px;
  border-top: 1px solid var(--line);
  background: var(--accbg);
}
#selbar span,
#tselbar span {
  flex: 1 1 100%;
  font-weight: 600;
  color: var(--acc);
}
#selbar button,
#tselbar button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 6px;
  height: 32px;
  padding: 0 10px;
}
#selbar #seldel,
#tselbar #tsdel {
  color: #d93025;
}
.obj input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--acc);
  flex: none;
}
.selall {
  padding: 0 10px 4px 44px;
}
.selall button {
  border: 0;
  background: none;
  color: var(--acc);
  padding: 4px 0;
  font-weight: 600;
}
.szr {
  display: flex;
  gap: 6px;
}
.szr button {
  flex: 1;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
  margin: 0 !important;
}
.szr button.on {
  background: var(--acc) !important;
  color: #fff;
  border-color: var(--acc);
}
.lbl {
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -50%);
  white-space: pre;
  font-family: system-ui, sans-serif;
  line-height: 1.15;
}
.nt,
.tt {
  text-shadow:
    0 0 2px var(--h),
    0 0 2px var(--h),
    0 0 3px var(--h),
    0 0 4px var(--h);
}
.nt {
  font-weight: 800;
}
.tt {
  font-weight: 700;
}
.tb {
  padding: 2px 7px;
  border-radius: 5px;
  font-weight: 600;
  box-shadow: 0 1px 3px #0006;
}
.nb {
  box-sizing: border-box;
  border-radius: 50%;
  border: 2px solid #fff;
  text-align: center;
  font-weight: 700;
  font-family: system-ui, sans-serif;
  box-shadow: 0 1px 3px #0007;
}
.vh {
  width: 20px;
  height: 20px;
  margin: 3px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid var(--acc);
  box-shadow: 0 1px 4px #0006;
  box-sizing: border-box;
}
.vh.big {
  width: 24px;
  height: 24px;
  margin: 1px;
}
.leaflet-popup-content .pg {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  margin-top: 8px;
}
.leaflet-popup-content .pg button {
  margin: 0;
  font-size: 20px;
  padding: 4px 0;
  background: none;
}
.leaflet-popup-content .pg button.on {
  background: var(--accbg);
}
#lbtn {
  left: 8px;
  bottom: calc(8px + var(--sa));
}
#lbtn svg {
  width: 22px;
  height: 22px;
  vertical-align: middle;
}
#info {
  display: none;
  position: absolute;
  z-index: 1000;
  top: calc(8px + env(safe-area-inset-top, 0px));
  left: 8px;
  width: max-content;
  max-width: calc(100% - 64px);
  background: var(--bar);
  padding: 7px 10px;
  border-radius: 8px;
  font-weight: 600;
  border-left: 4px solid var(--acc);
  box-shadow: 0 1px 4px #0004;
}
#fin {
  display: none;
  position: absolute;
  z-index: 1000;
  right: 56px;
  bottom: calc(8px + var(--sa));
  gap: 6px;
}
#fin .ib {
  position: static;
}
.go {
  background: #1e8e3e !important;
  color: #fff !important;
}
.no {
  background: #d93025 !important;
  color: #fff !important;
}
.bar {
  position: absolute;
  z-index: 1000;
  right: 8px;
  bottom: calc(8px + var(--sa));
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: var(--bar);
  border-radius: 22px;
  padding: 3px;
  box-shadow: 0 1px 4px #0005;
}
.bar button {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--txt);
  padding: 7px;
  font-size: 16px;
}
.bar button.on {
  background: var(--acc);
  color: #fff;
}
.bar button .tbi {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  line-height: 1;
  width: 100%;
  height: 100%;
}
.bar button .tbi svg {
  width: 22px;
  height: 22px;
}
.bar svg {
  width: 100%;
  height: 100%;
  display: block;
}
.pop {
  display: none;
  position: absolute;
  z-index: 1100;
  background: var(--bar);
  border-radius: 10px;
  box-shadow: 0 2px 10px #0004;
}
.sec {
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--sub);
  padding: 8px 14px 2px;
}
#bmenu {
  top: calc(8px + env(safe-area-inset-top, 0px));
  right: 56px;
  overflow: auto;
  max-height: 78%;
  min-width: 216px;
  max-width: calc(100% - 66px);
  padding: 4px 0;
}
#bmenu .ov {
  padding: 3px 14px 6px;
}
#bmenu .ov input[type="range"] {
  width: 100%;
  margin: 3px 0 0;
}
#bmenu .st {
  display: block;
  color: var(--sub);
  font-size: 10px;
  margin-top: 2px;
  font-weight: 400;
}
#bmenu button.sm {
  font-size: 12px;
  padding: 5px 14px 5px 30px;
}
#bmenu .ver {
  font-size: 10px;
  color: var(--sub);
  padding: 6px 14px 4px;
}
#bmenu button,
#xmenu button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: none;
  padding: 9px 14px;
  white-space: nowrap;
}
#bmenu button {
  white-space: normal;
}
#bmenu button.on,
#xmenu button.on {
  background: var(--accbg);
  color: var(--acc);
  font-weight: 700;
}
#xmenu {
  position: fixed;
  z-index: 1300;
  overflow: auto;
  max-height: 70%;
  max-width: calc(100% - 16px);
}
#xmenu .sep {
  border-top: 1px solid var(--line);
  margin: 4px 0;
}
#dmenu {
  position: fixed;
  right: 56px;
  z-index: 1200;
  overflow: hidden;
  padding: 4px 0;
}
#dmenu button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: 0;
  background: none;
  padding: 9px 14px;
  text-align: left;
}
#dmenu button.on {
  background: var(--accbg);
  color: var(--acc);
  font-weight: 700;
}
#dmenu .mi svg {
  width: 20px;
  height: 20px;
  display: block;
}
#dmenu .pg {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  padding: 2px 8px 6px;
}
#dmenu .pg button {
  padding: 5px 0;
  justify-content: center;
  font-size: 20px;
  border-radius: 8px;
  width: auto;
}
#prof {
  display: none;
  position: absolute;
  z-index: 1150;
  left: 8px;
  right: 56px;
  bottom: calc(56px + var(--sa));
  max-width: 420px;
  background: var(--bar);
  border-radius: 10px;
  padding: 6px 8px;
  box-shadow: 0 2px 10px #0004;
}
#prof .ph {
  display: flex;
  align-items: center;
  font-weight: 700;
  margin-bottom: 2px;
}
#prof .ph b {
  flex: 1;
}
#prof .ph button {
  border: 0;
  border-radius: 6px;
  background: var(--b2);
  height: 26px;
  min-width: 28px;
}
#prof svg {
  width: 100%;
  height: 140px;
  display: block;
  touch-action: none;
}
#psv .ax {
  fill: var(--sub);
  font-size: 9px;
}
#psv .ab {
  fill: var(--acc);
  font-weight: 700;
  font-size: 12px;
}
#pread {
  font-size: 12px;
  font-weight: 700;
  color: var(--acc);
  min-height: 16px;
  margin: 3px 0;
}
#pst {
  font-size: 11.5px;
  line-height: 1.4;
}
#cmeb {
  display: none;
  margin-left: 8px;
  border: 0;
  border-radius: 6px;
  background: #d93025;
  color: #fff;
  padding: 3px 8px;
  font-weight: 700;
}
.cpop .cll {
  font-size: 16px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin: 2px 0;
}
.cpop .cdist {
  margin: 6px 0 2px;
  font-weight: 600;
  color: var(--acc);
}
.cpop .cdist button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12.5px;
}
.cpop .tbt {
  margin-top: 8px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(80px + var(--sa));
  transform: translateX(-50%);
  background: #202124;
  color: #fff;
  padding: 8px 14px;
  border-radius: 18px;
  z-index: 3000;
  font-size: 13.5px;
}
#pbtn {
  display: none;
  margin-left: 8px;
  border: 0;
  border-radius: 6px;
  background: var(--acc);
  color: #fff;
  padding: 3px 8px;
  font-weight: 700;
}
#sty {
  right: 56px;
  bottom: calc(56px + var(--sa));
  padding: 10px;
  gap: 10px;
  flex-direction: column;
  width: 250px;
}
#sty .sw {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}
#sty .sw button {
  height: 36px;
  border: 2px solid #0002;
  border-radius: 6px;
  padding: 0;
}
#sty .sw button.on {
  border-color: #202124;
  box-shadow: 0 0 0 2px var(--acc);
}
#sty label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
#sty input[type="range"] {
  flex: 1;
  min-width: 0;
}
/* panel map i warstw – wzorowany na Moich Mapach Google */
#sheet {
  left: 8px;
  top: calc(8px + env(safe-area-inset-top, 0px));
  bottom: calc(56px + var(--sa));
  width: min(330px, calc(100% - 60px));
  flex-direction: column;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
}
#sh {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 6px 6px 14px;
}
#mapb {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: none;
  padding: 4px 0;
  text-align: left;
}
#mapb b {
  font-size: 19px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#mapb span {
  color: var(--sub);
  font-size: 12px;
}
#closes {
  border: 0;
  background: none;
  font-size: 18px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  color: var(--sub);
}
#sa {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 14px;
  padding: 6px 14px 8px;
  background: var(--b2);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
#sa button {
  border: 0;
  background: none;
  padding: 6px 0;
  font-size: 13.5px;
  font-weight: 500;
}
#list {
  overflow: auto;
  flex: 1;
  padding: 2px 0 12px;
}
.g {
  border-bottom: 1px solid var(--line);
  padding: 2px 0;
}
.gh {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px 6px;
}
.gh .nm {
  font-weight: 700;
}
.ctl {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  padding: 4px 10px 10px 40px;
}
.ctl button {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 6px;
  min-width: 34px;
  height: 32px;
  padding: 0 9px;
}
.ctl select {
  flex: 1 1 100%;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fff;
}
.ctl input[type="range"] {
  flex: 1;
  min-width: 90px;
}
.ctl span {
  font-size: 11px;
  color: var(--sub);
}
.l {
  border-left: 4px solid transparent;
}
.l.act {
  border-left-color: var(--acc);
  background: #f8faff;
}
.lr {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 5px 6px 5px 8px;
}
.lr input[type="checkbox"],
.gh input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 0 4px;
  accent-color: var(--acc);
  flex: none;
}
.nm {
  flex: 1;
  min-width: 0;
  text-align: left;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  border: 0;
  background: none;
  padding: 5px 2px;
  font-size: 14px;
}
.l.act .nm {
  font-weight: 700;
}
.ex,
.more {
  border: 0;
  background: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: var(--sub);
  font-size: 15px;
  flex: none;
  padding: 0;
}
.cnt {
  font-size: 11px;
  color: var(--sub);
  min-width: 18px;
  text-align: right;
}
.tag {
  font-size: 10.5px;
  color: var(--acc);
  padding: 0 0 5px 66px;
}
.obj {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px 7px 44px;
  cursor: pointer;
}
.obj:active {
  background: var(--b2);
}
.obj .oi {
  width: 22px;
  text-align: center;
  font-size: 17px;
  flex: none;
  line-height: 1;
}
.obj .oi svg {
  width: 18px;
  height: 18px;
  display: block;
  margin: auto;
}
.obj .on {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13.5px;
}
.obj .on.auto {
  color: var(--sub);
}
.obj .cm {
  font-size: 11px;
}
.empty {
  padding: 4px 10px 8px 44px;
  color: var(--sub);
  font-size: 12px;
}
/* okna dialogowe */
.dback {
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.dbox {
  background: #fff;
  color: var(--txt);
  border-radius: 12px;
  padding: 18px;
  width: min(360px, 100%);
  box-shadow: 0 4px 24px #0006;
  max-height: 90%;
  overflow: auto;
}
.dt {
  font-size: 15px;
  margin-bottom: 14px;
  line-height: 1.4;
  white-space: pre-line;
}
.dbox input,
.dbox textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 0 10px;
  font-size: 16px;
  margin-bottom: 14px;
}
.dbox input {
  height: 44px;
}
.dbox textarea {
  min-height: 120px;
  padding: 8px 10px;
  resize: vertical;
  font:
    15px system-ui,
    sans-serif;
}
.db {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.db button {
  border: 0;
  border-radius: 8px;
  min-height: 38px;
  padding: 0 14px;
  background: var(--b2);
  font-size: 14px;
  font-weight: 500;
}
.db button.okb {
  background: var(--acc);
  color: #fff;
}
.db button.danger {
  background: #d93025;
  color: #fff;
}
/* znaczniki na mapie */
.abm {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  color: #fff;
  border: 2px solid #fff;
  font:
    700 12px/18px system-ui,
    sans-serif;
  text-align: center;
  box-shadow: 0 1px 3px #0008;
}
.arw {
  color: #ffc83d;
  font-size: 16px;
  line-height: 18px;
  text-align: center;
  text-shadow:
    0 0 3px #000,
    0 0 2px #000;
}
.tk {
  position: relative;
}
.tk i {
  position: absolute;
  left: -5px;
  top: -5px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #202124;
  box-sizing: border-box;
}
.tk span {
  position: absolute;
  left: 8px;
  top: -9px;
  white-space: nowrap;
  background: rgba(32, 33, 36, 0.85);
  color: #fff;
  font:
    600 10px system-ui,
    sans-serif;
  padding: 1px 4px;
  border-radius: 4px;
}
.shm {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #2e7d32;
  font-size: 14px;
  line-height: 22px;
  text-align: center;
  box-shadow: 0 1px 3px #0006;
  box-sizing: border-box;
}

 *    p: [[szer, dł], …] współrzędne WGS84,  r: promień okręgu w m,  l: id warstwy,
 *    c: kolor, o: krycie wypełnienia,  i: ikona (np. 'g:kania', '📍'),  nm: własna nazwa,
 *    n: komentarz,  ph: [linki do zdjęć],  ra: ocena 1–5,  sz: rozmiar,  no: numer,  tx: tekst,

// Ujednolicenie starszych rysunków (rośliny) z nowym stylem: grubszy kontur w kolorze K i stonowane kolory
function muteHex(hex) {
  let r = parseInt(hex.slice(1, 3), 16) / 255,
    g = parseInt(hex.slice(3, 5), 16) / 255,
    b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b),
    mn = Math.min(r, g, b);
  let h = 0,
    s = 0,
    L = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn;
    s = L > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h /= 6;
  }
  if (s < 0.25) return hex;
  s *= 0.72;
  if (L > 0.85) L = 0.9;
  else L = L * 0.94 + 0.04;
  const q = L < 0.5 ? L * (1 + s) : L + s - L * s,
    pp = 2 * L - q,
    f = t => {
      t < 0 && (t += 1);
      t > 1 && (t -= 1);
      return t < 1 / 6
        ? pp + (q - pp) * 6 * t
        : t < 1 / 2
          ? q
          : t < 2 / 3
            ? pp + (q - pp) * (2 / 3 - t) * 6
            : pp;
    };
  return (
    '#' +
    [f(h + 1 / 3), f(h), f(h - 1 / 3)]
      .map(x =>
        Math.round(x * 255)
          .toString(16)
          .padStart(2, '0')
      )
      .join('')
  );
}
function restyleSvg(svg) {

    .replace(
      /stroke="#3b2a1f" stroke-width="0?\.9"/g,
      'stroke="#3a2c22" stroke-width="1.25" stroke-linecap="round"'
    )
    .replace(/stroke="#3b2a1f" stroke-width="\.7"/g, 'stroke="#3a2c22" stroke-width=".95"')
    .replace(/(fill|stroke)="(#[0-9a-fA-F]{6})"/g, (m, a, c) => a + '="' + muteHex(c) + '"');
}

      if (!i.cr) i.cr = t;
      if (!i.up) i.up = t;

    return d;
  },
  2: d => {
    const m = {
      id: uid(),
      name: 'Moja mapa',
      groups: d.groups || [],
      active: d.active,
      items: d.items || [],
      cr: Date.now()

    return {cur: m.id, maps: [m]};
  },
  3: d => {
    (d.maps || []).forEach(flatGroups);

  4: d => {
    (d.maps || []).forEach(m =>

function ring(c, r, n = 48) {

async function kmzText(buf) {

      e = i;

      cl = dv.getUint16(p + 32, true);

      name: td.decode(u8.subarray(p + 46, p + 46 + fl)),
      meth: dv.getUint16(p + 10, true),
      csz: dv.getUint32(p + 20, true),
      off: dv.getUint32(p + 42, true)

    );

function filterDlg() {

  });

  const showLayersFor = cs => {
    const S = new Set(cs);
    P.items.forEach(i => {
      if (S.has(catOf(i))) {
        const f = findL(i.l);
        if (f) {
          f.l.vis = true;
          f.g.vis = true;
        }
      }
    });
  };

    sheetIfOpen();

    ...IGROUPS.map(g => ({k: g.k, n: g.n, s: g.s, svg: 1})),
    {k: 'x', n: 'Inne ikony', s: '❔'},
    {k: '_', n: 'Pozostałe', s: '✏️'}
  ];
  const gOf = c => (c === '_' ? '_' : ICONS[c] ? ICONS[c].g : 'x');

    list.innerHTML = '';

    groups.forEach(g => {
      const cs = Object.keys(cnt)

        .sort((a, b) => catName(a).localeCompare(catName(b), 'pl'));
      if (!cs.length) return;

        hc = h('input');
      hc.type = 'checkbox';
      const on = cs.filter(c => !HS.has(c)).length;
      hc.checked = on === cs.length;
      hc.indeterminate = on > 0 && on < cs.length;
      hc.onchange = () => {
        const H = hidSet();
        cs.forEach(c => (hc.checked ? H.delete(c) : H.add(c)));
        setH([...H], hc.checked ? cs : null);
      };
      const sy = h('span', 'fi');

          ic = h('span', 'fi');
        cb.type = 'checkbox';
        cb.checked = !HS.has(c);
        cb.onchange = () => {

          cb.checked ? H.delete(c) : H.add(c);
          setH([...H], cb.checked ? [c] : null);
        };
        ic.innerHTML = c === '_' ? '✏️' : iconHtml(c, 24);
        const o = B(
          'tylko',
          e => {
            e.preventDefault();
            e.stopPropagation();
            setH(
              Object.keys(cnt).filter(x => x !== c),
              [c]
            );
          },
          'fo',
          'Pokaż tylko tę kategorię (włącza też jej warstwę i grupę)'

        r.append(cb, ic, h('span', 'fn', catName(c)), h('span', 'fc', String(cnt[c])), o);

    B('Pokaż wszystko', () => setH([])),
    B('Gotowe', fin, 'okb')

  document.body.append(back);
  back.addEventListener('click', e => {
    if (e.target === back) fin();
  });

async function drawTiles(ctx, l, z, x0, y0, W, H, op, prog) {
  const nz = Math.min(z, nativeMax(l)),
    tp = l.getTileSize().x * Math.pow(2, z - nz),
    N = Math.round((Math.pow(2, nz) * 256) / l.getTileSize().x);

  l._tileZoom = nz;

    if (y < 0 || y >= N) continue;
    for (let x = Math.floor(x0 / tp); x <= Math.floor((x0 + W - 1) / tp); x++) {
      const c = L.point(((x % N) + N) % N, y);
      c.z = nz;

        jobs.push({x, y, u: ok ? null : l.getTileUrl(c), k: ok ? offKey(l._offId, nz, c.x, y) : null});
      } catch (e) {}

        clearTimeout(t);
        bad++;
        res();

// ---------- wysokość z NMT (usługa GUGiK) ----------
function puwg(lat, lon) {
  // WGS84/ETRS89 -> PL-1992 (EPSG:2180), zwraca [N(x),E(y)] jak w usłudze GUGiK
  const a = 6378137,
    e2 = 0.0066943800229,
    ep2 = e2 / (1 - e2),
    k0 = 0.9993,
    f = lat * rad,
    l = (lon - 19) * rad;
  const sn = Math.sin(f),
    c = Math.cos(f),
    t = Math.tan(f),
    T = t * t,
    C = ep2 * c * c,
    A = l * c,
    N = a / Math.sqrt(1 - e2 * sn * sn);
  const M =
    a *
    ((1 - e2 / 4 - (3 * e2 * e2) / 64 - (5 * e2 ** 3) / 256) * f -
      ((3 * e2) / 8 + (3 * e2 * e2) / 32 + (45 * e2 ** 3) / 1024) * Math.sin(2 * f) +
      ((15 * e2 * e2) / 256 + (45 * e2 ** 3) / 1024) * Math.sin(4 * f) -
      ((35 * e2 ** 3) / 3072) * Math.sin(6 * f));
  const E =
    500000 +
    k0 * N * (A + ((1 - T + C) * A ** 3) / 6 + ((5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5) / 120);
  const Y =
    k0 *
      (M +
        N *
          t *
          ((A * A) / 2 +
            ((5 - T + 9 * C + 4 * C * C) * A ** 4) / 24 +
            ((61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6) / 720)) -
    5300000;
  return [Y, E];
}
localStorage.removeItem('mapa-nmt-http'); // usługa wysokości działa przez https, nie zapamiętujemy obejścia
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
async function nmtGet(q) {
  // https, a tylko przy błędzie połączenia jednorazowo http
  const go = async proto => {
    const ac = new AbortController(),
      tm = setTimeout(() => ac.abort(), 12000);
    try {
      const url = proto + '://services.gugik.gov.pl/nmt/?' + q,
        H = proto === 'http' && plug('CapacitorHttp');
      if (H) {
        // w aplikacji zapytania po HTTP są blokowane w WebView (bezpieczeństwo) – zapasowo idą natywnie
        const r = await H.get({url, responseType: 'text', readTimeout: 12000, connectTimeout: 12000});
        return String(r.data).trim();
      }
      const r = await fetch(url, {signal: ac.signal});
      return String(await r.text()).trim();
    } finally {
      clearTimeout(tm);
    }
  };
  try {
    return await go('https');
  } catch (e) {
    if (e instanceof TypeError) return await go('http');
    throw e;
  }
}
// Wiele punktów jednym zapytaniem (usługa przyjmuje do 500 punktów i ogranicza liczbę zapytań; zwraca trójki "x y h")
async function hList(lls) {
  const out = [];
  for (let s = 0; s < lls.length; s += 400) {
    const part = lls.slice(s, s + 400),
      list = part
        .map(ll => {
          const [x, y] = puwg(ll[0], ll[1]);
          return x.toFixed(2) + '%20' + y.toFixed(2);
        })
        .join(',');
    let hs = null;
    for (let a = 0; a < 3 && !hs; a++) {
      if (a) await sleepMs(2000);
      const txt = await nmtGet('request=GetHByPointList&list=' + list);
      if (/error|warning/i.test(txt)) continue;
      const nums = txt
        .split(/[,\s]+/)
        .filter(Boolean)
        .map(Number);
      const v =
        nums.length === part.length * 3
          ? nums.filter((_, i) => i % 3 === 2)
          : nums.length === part.length
            ? nums
            : null;
      if (v && v.every(isFinite) && !v.every(z => z === 0)) hs = v;
    }
    if (!hs) throw new Error('usługa NMT nie zwróciła wysokości');
    out.push(...hs);
  }
  return out;
}
async function hAt(ll) {
  // pojedynczy punkt (z jedną ponowną próbą)
  const [x, y] = puwg(ll[0], ll[1]);
  let v = NaN;
  for (let a = 0; a < 2 && isNaN(v); a++) {
    if (a) await sleepMs(1500);
    v = parseFloat(await nmtGet('request=GetHByXY&x=' + x.toFixed(2) + '&y=' + y.toFixed(2)));
  }
  if (isNaN(v)) throw new Error('brak danych NMT (poza Polską albo usługa chwilowo nie odpowiada)');
  return v;
}
const hErr = e =>
  e && e.name === 'AbortError'
    ? 'usługa GUGiK nie odpowiada (przekroczony czas)'
    : e instanceof TypeError
      ? 'brak odpowiedzi usługi GUGiK (brak internetu albo blokada CORS w przeglądarce)'
      : e.message;

function along(pts, cum, d) {
  let i = 1;
  while (i < pts.length - 1 && cum[i] < d) i++;
  const t = Math.min(1, Math.max(0, (d - cum[i - 1]) / (cum[i] - cum[i - 1] || 1)));
  return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
}
function niceStep(total, target) {
  const raw = total / target,
    p = Math.pow(10, Math.floor(Math.log10(raw))),
    m = raw / p;
  return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
}
const fdk = d => (d >= 1000 ? +(d / 1000).toFixed(2) + ' km' : +d.toFixed(1) + ' m');
async function profile(pts) {
  pts = pts.slice();
  const total = pts.length > 1 ? dist(pts) : 0;
  if (total < 1) return tell('Odcinek jest za krótki na profil.');
  $('sheet').style.display = 'none';
  closePops();
  const box = $('prof'),
    st = $('pst'),
    svg = $('psv'),
    rd = $('pread');
  box.style.display = 'block';
  svg.innerHTML = '';
  svg.style.display = 'none';
  rd.textContent = '';
  st.textContent = 'Pobieram wysokości z NMT…';
  const cum = [0];
  pts.forEach((q, i) => {
    if (i) cum.push(cum[i - 1] + map.distance(pts[i - 1], q));
  });
  const step = niceStep(total, 5),
    ticks = [];
  for (let d = step; d < total - step * 0.15; d += step) ticks.push(d);
  // trasa na mapie: A (start), B (cel), kierunek i znaczniki odległości
  tmp.clearLayers();
  pcm = null;
  L.polyline(pts, {pane: 'tmpP', color: '#ffc83d', weight: 4, dashArray: '6 6'}).addTo(tmp);
  for (let i = 1; i < pts.length; i++) arrow(pts[i - 1], pts[i]);
  ticks.forEach(d =>
    L.marker(along(pts, cum, d), {
      pane: 'tmpP',
      interactive: false,
      icon: L.divIcon({
        className: '',
        html: '<div class="tk"><i></i><span>' + fdk(d) + '</span></div>',
        iconSize: [0, 0]
      })
    }).addTo(tmp)
  );
  lab(pts[0], 'A', '#2e9e6b');
  lab(pts[pts.length - 1], 'B', '#d32f2f');
  // próbki co ok. 1 m na krótkich odcinkach, najwyżej 61 zapytań
  const mkS = n => {
    const a = [];
    for (let k = 0; k <= n; k++) {
      const d = (total * k) / n;
      a.push({d, ll: along(pts, cum, d)});
    }
    return a;
  };
  let S = mkS(Math.max(8, Math.min(200, Math.ceil(total)))),
    hs; // co ok. 1 m do 200 m długości
  try {
    hs = await hList(S.map(q => q.ll));
  } catch (e1) {
    // zapasowo: pojedyncze zapytania, po dwa naraz, rzadsze próbkowanie
    try {
      S = mkS(Math.max(8, Math.min(40, Math.ceil(total))));
      hs = new Array(S.length);
      let idx = 0;
      st.textContent = 'Pobieram wysokości z NMT (tryb wolniejszy)…';
      await Promise.all(
        Array.from({length: 2}, async () => {
          while (idx < S.length) {
            const i = idx++;
            hs[i] = await hAt(S[i].ll);
          }
        })
      );
    } catch (e) {
      st.textContent = 'Nie udało się pobrać wysokości: ' + hErr(e) + '. Spróbuj ponownie za chwilę.';
      return;
    }
  }
  const mn = Math.min(...hs),
    mx = Math.max(...hs);
  let up = 0,
    dn = 0;
  hs.forEach((v, i) => {
    if (i) {
      const d = v - hs[i - 1];
      d > 0 ? (up += d) : (dn -= d);
    }
  });
  svg.style.display = '';
  const W = Math.max(240, Math.round(svg.getBoundingClientRect().width) || 300),
    H = 140,
    ml = 40,
    mr = 10,
    mt = 10,
    mb = 18,
    pw = W - ml - mr,
    ph = H - mt - mb;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  const PX = d => ml + (d / total) * pw,
    PY = v => mt + (mx > mn ? (mx - v) / (mx - mn) : 0.5) * ph;
  let g = '';
  [mn, (mn + mx) / 2, mx].forEach(v => {
    g +=
      '<line x1="' +
      ml +
      '" x2="' +
      (W - mr) +
      '" y1="' +
      PY(v) +
      '" y2="' +
      PY(v) +
      '" stroke="#fff" stroke-opacity=".15"/><text x="' +
      (ml - 4) +
      '" y="' +
      (PY(v) + 3) +
      '" text-anchor="end" class="ax">' +
      v.toFixed(1) +
      '</text>';
  });
  [0, ...ticks].forEach(d => {
    g +=
      '<line x1="' +
      PX(d) +
      '" x2="' +
      PX(d) +
      '" y1="' +
      mt +
      '" y2="' +
      (H - mb) +
      '" stroke="#fff" stroke-opacity=".12"/><text x="' +
      PX(d) +
      '" y="' +
      (H - 5) +
      '" text-anchor="middle" class="ax">' +
      (d ? fdk(d) : '0') +
      '</text>';
  });
  const pl = S.map((q, i) => PX(q.d).toFixed(1) + ',' + PY(hs[i]).toFixed(1)).join(' ');
  g +=
    '<polygon points="' +
    PX(0) +
    ',' +
    (H - mb) +
    ' ' +
    pl +
    ' ' +
    PX(total) +
    ',' +
    (H - mb) +
    '" fill="#ffc83d" fill-opacity=".25"/><polyline points="' +
    pl +
    '" fill="none" stroke="#ffc83d" stroke-width="2"/>';
  g +=
    '<text x="' +
    (ml + 3) +
    '" y="' +
    (mt + 11) +
    '" class="ab">A</text><text x="' +
    (W - mr - 3) +
    '" y="' +
    (mt + 11) +
    '" text-anchor="end" class="ab">B</text>';
  g +=
    '<g id="pcur" style="display:none"><line id="pcl" y1="' +
    mt +
    '" y2="' +
    (H - mb) +
    '" stroke="#fff"/><circle id="pcd" r="4" fill="#ffc83d" stroke="#16212b" stroke-width="1.5"/></g>';
  svg.innerHTML = g;
  const hAtD = d => {
    let i = 1;
    while (i < S.length - 1 && S[i].d < d) i++;
    const a = S[i - 1],
      b = S[i],
      t = (d - a.d) / (b.d - a.d || 1);
    return hs[i - 1] + (hs[i] - hs[i - 1]) * t;
  };
  const cursor = e => {
    const r = svg.getBoundingClientRect();
    if (!r.width) return;
    const d = Math.min(total, Math.max(0, ((((e.clientX - r.left) * W) / r.width - ml) / pw) * total)),
      v = hAtD(d);
    $('pcur').style.display = '';
    $('pcl').setAttribute('x1', PX(d));
    $('pcl').setAttribute('x2', PX(d));
    $('pcd').setAttribute('cx', PX(d));
    $('pcd').setAttribute('cy', PY(v));
    rd.textContent = fm(d) + ' od A → ' + v.toFixed(1) + ' m n.p.m.';
    const ll = along(pts, cum, d);
    if (pcm) pcm.setLatLng(ll);
    else
      pcm = L.circleMarker(ll, {
        pane: 'tmpP',
        radius: 7,
        color: '#16212b',
        weight: 2,
        fillColor: '#fff',
        fillOpacity: 1
      }).addTo(tmp);
  };
  svg.onpointerdown = e => {
    try {
      svg.setPointerCapture(e.pointerId);
    } catch (_) {}
    cursor(e);
  };
  svg.onpointermove = cursor;
  rd.textContent = 'Dotknij lub przesuń palcem po wykresie, aby odczytać wysokość';
  const last = hs[hs.length - 1],
    dd = last - hs[0];
  st.innerHTML =
    'Długość ' +
    fm(total) +
    ' · min ' +
    mn.toFixed(1) +
    ' m · maks ' +
    mx.toFixed(1) +
    ' m<br>A ' +
    hs[0].toFixed(1) +
    ' m → B ' +
    last.toFixed(1) +
    ' m (Δ ' +
    (dd >= 0 ? '+' : '') +
    dd.toFixed(1) +
    ' m) · podejścia +' +
    up.toFixed(0) +
    ' m, zejścia −' +
    dn.toFixed(0) +
    ' m<br><span style="opacity:.6">NMT GUGiK, układ PL-KRON86-NH</span>';
}

$('gps').onclick = async () => {
  if (!navigator.geolocation) return tell('Ta przeglądarka nie obsługuje GPS. Otwórz OMM w Chrome.');
  if (watching !== null) {
    if (me) map.setView(me.getLatLng(), Math.max(map.getZoom(), 17));
    return;
  }
  try {
    // w APK o zgodę pyta Android przy pierwszym użyciu GPS – nie sprawdzamy jej wcześniej
    const st = !NATIVE && navigator.permissions && (await navigator.permissions.query({name: 'geolocation'}));
    if (st && st.state === 'denied') return tell(gpsHelp({code: 1}));
  } catch (e) {}
  info.style.display = 'block';
  info.textContent = 'Szukam pozycji GPS…';
  watching = navigator.geolocation.watchPosition(
    pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (!mode) info.style.display = 'none';
      if (pos.coords.heading != null && isFinite(pos.coords.heading) && (pos.coords.speed || 0) > 0.7)
        meGpsHead = pos.coords.heading; // kierunek ruchu z GPS – gdy telefon nie ma kompasu
      if (!me) {
        // kropka pozycji ze stożkiem kierunku (kompas telefonu)
        me = L.marker(ll, {

          color: '#1e88e5',
          weight: 1,
          fillOpacity: 0.12
        }).addTo(map);
      } else {
        me.setLatLng(ll);
        meCone();
        acc.setLatLng(ll);
        acc.setRadius(pos.coords.accuracy);
      }
      if (first) {
        map.setView(ll, 17);
        first = false;
      }
    },
    err => {
      if (err.code === 3 && me) return; // chwilowy brak sygnału przy działającym śledzeniu – czekamy dalej
      navigator.geolocation.clearWatch(watching);
      watching = null;

      if (!mode) info.style.display = 'none';

/*
 * Ślady są osobno od map – mają własne warstwy (np. „Grzybobranie”, „Spacery”) i własną zakładkę
 * „Ślady GPS” w panelu warstw. Każde nagranie zapisuje się jako NOWY ślad (nic nie jest nadpisywane).
 *
 * DANE ŚLADÓW
 *  TRK = { v: 1, active: id warstwy dla nowych śladów, layers: [warstwa], items: [ślad] }
 *  warstwa = { id, name, vis: widoczna, c: kolor, open: rozwinięta lista }
 *  ślad    = { id, l: id warstwy, nm: nazwa, c?: własny kolor, vis?: false = ukryty,
 *              st: początek nagrania (ms), pts: [[szer, dł, wysokość m | null, sekundy od początku], …],
 *              sg: [numery punktów, od których zaczyna się kolejny odcinek – po pauzie],
 *              wp: [punkt na trasie: {id, p: [szer, dł], s: sekundy od początku, nm?, n?: opis,
 *                    ph?: zdjęcia, i?: ikona, ref?: id punktu mapy dodanego w czasie nagrywania –
 *                    dane punktu są też skopiowane do śladu, więc zostają po usunięciu punktu z mapy}],
 *              noTime?: true = ślad bez czasów (np. z GPX bez znaczników czasu), cr / up: daty (ms),
 *              a?: rodzaj aktywności – 'pieszo' | 'bieg' | 'rower' | 'auto' | 'inne' (w GPX jako <type>) }
 *  Zapis: IndexedDB „omm” → „slady” (dużo miejsca); gdy niedostępna – localStorage „omm-slady”.
 *  Trwające nagranie: localStorage „omm-rec”, zapisywane na bieżąco – przetrwa zamknięcie aplikacji.
 *  W kopii zapasowej ślady są obiektami GeoJSON (MultiLineString) z polem „sekcja”: „slady”.
 *
 * NAGRYWANIE
 *  W aplikacji na Androida działa też przy wygaszonym ekranie (wtyczka BackgroundGeolocation
 *  uruchamia usługę z powiadomieniem „OMM nagrywa ślad”). W przeglądarce – tylko przy włączonym ekranie.
 */
const IDB = (() => {
  // bardzo mały magazyn klucz → wartość w IndexedDB
  let dbp = null;
  const open = () =>
    dbp ||
    (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('omm', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  const run = (mode, fn) =>
    open().then(
      db =>
        new Promise((res, rej) => {
          const t = db.transaction('kv', mode),
            q = fn(t.objectStore('kv'));
          t.oncomplete = () => res(q.result);
          t.onerror = t.onabort = () => rej(t.error);
        })
    );
  return {
    get: k => run('readonly', s => s.get(k)),
    set: (k, v) => run('readwrite', s => s.put(v, k)),
    del: k => run('readwrite', s => s.delete(k)),
    // wiele zapisów / usunięć w jednej transakcji (kafle map offline)
    setMany: list => run('readwrite', s => (list.forEach(([k, v]) => s.put(v, k)), s.count())),
    delMany: keys => run('readwrite', s => (keys.forEach(k => s.delete(k)), s.count())),
    keys: prefix => run('readonly', s => s.getAllKeys(IDBKeyRange.bound(prefix, prefix + '\uffff')))
  };
})();

const hav = (a, b) => {
  // odległość dwóch punktów [szer, dł] w metrach (wzór haversine)
  const R = 6371008.8,
    r = Math.PI / 180,
    dLa = (b[0] - a[0]) * r,
    dLo = (b[1] - a[1]) * r,
    s = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
};

async function pickMapLayer(title) {

  const ms = modeMaps();
  let m = P;
  if (ms.length > 1) {
    const id = await dlg({
      title: title + '\n\nNa którą mapę?',
      btns: [...ms.map(x => ({t: (x === P ? '● ' : '') + x.name, v: x.id})), {t: 'Anuluj', v: null}]

        v: l.id
      })),
      {t: '＋ Nowa warstwa…', v: '+'},
      {t: 'Anuluj', v: null}

  });

  const nl = {id: uid(), name: n.trim().slice(0, 200), vis: true, op: 1, open: true};

async function trkWpToMap(t) {
  // zdjęcia i punkty ze śladu → zwykłe punkty na wybranej mapie i warstwie (kopie; zdjęcia wspólne)
  wpSyncAll();
  const wps = t.wp || [];

  );

  const {m, l} = r;

    sk = 0;
  wps.forEach(w => {
    // pomijamy punkty, które już są na tej mapie (oryginał albo wcześniejsza kopia)
    if (m.items.some(i => (w.ref && i.id === w.ref) || i.tw === w.id)) return sk++;
    const it = {
      id: uid(),
      t: 'pin',
      i: w.i || (w.n || w.nm ? '📍' : 'o:foto'),

      l,
      ...style(),
      tw: w.id, // pochodzi z punktu śladu
      cr: t.noTime ? Date.now() : t.st + (w.s || 0) * 1000,
      up: Date.now()
    };
    if (w.nm) it.nm = w.nm;
    if (w.n) it.n = w.n;
    if (w.ph && w.ph.length) it.ph = [...w.ph];
    m.items.push(it);
    if (Array.isArray(m.hide) && m.hide.includes(it.i)) m.hide = m.hide.filter(x => x !== it.i);
    n++;
  });
  const g = m.groups.find(x => x.layers.some(y => y.id === l)),
    ly = g && g.layers.find(y => y.id === l);
  if (ly) ly.vis = g.vis = true;
  save();
  render();
  sheetIfOpen();
  const msg =
    (n ? 'Dodano ' + n + ' ' + plural(n, 'punkt', 'punkty', 'punktów') : 'Nic nie dodano') +
    ' na mapę „' +
    m.name +
    '”' +
    (ly ? ', warstwa „' + ly.name + '”' : '') +
    '.' +
    (sk
      ? '\n' + sk + ' ' + plural(sk, 'punkt był', 'punkty były', 'punktów było') + ' już na tej mapie.'
      : '');
  if (m === P || !n) return tell(msg);
  if (
    (await dlg({
      title: msg,
      btns: [
        {t: 'OK', v: 0},
        {t: 'Otwórz mapę', v: 1, c: 'okb'}
      ]
    })) === 1
  )
    openMap(m.id);
}

// --- okno statystyk z profilem wysokości ---
function chartSvg(xs, ys, unit) {
  // prosty wykres liniowy (np. wysokość względem odległości); xs w metrach
  const W = 320,
    H = 120,
    L0 = 34,
    T0 = 8,
    w = W - L0 - 6,
    hh = H - T0 - 18;
  let y0 = Math.min(...ys),
    y1 = Math.max(...ys);
  if (y1 - y0 < 10) {
    y0 -= 5;
    y1 += 5;
  }
  const x1 = xs[xs.length - 1] || 1,
    X = x => L0 + (x / x1) * w,
    Y = y => T0 + hh - ((y - y0) / (y1 - y0)) * hh;
  let d = '';
  xs.forEach((x, i) => (d += (i ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(ys[i]).toFixed(1)));
  const area = d + 'L' + X(x1) + ' ' + (T0 + hh) + 'L' + L0 + ' ' + (T0 + hh) + 'Z';
  return (
    '<svg class="tch" viewBox="0 0 ' +
    W +
    ' ' +
    H +
    '">' +
    '<path d="' +
    area +
    '" fill="#1a73e8" opacity=".12"/>' +
    '<path d="' +
    d +
    '" fill="none" stroke="#1a73e8" stroke-width="1.6"/>' +
    '<line x1="' +
    L0 +
    '" y1="' +
    (T0 + hh) +
    '" x2="' +
    (W - 6) +
    '" y2="' +
    (T0 + hh) +
    '" stroke="#dadce0"/>' +
    '<text x="' +
    (L0 - 4) +
    '" y="' +
    (T0 + 8) +
    '" text-anchor="end">' +
    Math.round(y1) +
    '</text>' +
    '<text x="' +
    (L0 - 4) +
    '" y="' +
    (T0 + hh) +
    '" text-anchor="end">' +
    Math.round(y0) +
    '</text>' +
    '<text x="' +
    (L0 - 4) +
    '" y="' +
    (T0 + hh / 2 + 3) +
    '" text-anchor="end">' +
    unit +
    '</text>' +
    '<text x="' +
    L0 +
    '" y="' +
    (H - 3) +
    '">0</text>' +
    '<text x="' +
    (W - 6) +
    '" y="' +
    (H - 3) +
    '" text-anchor="end">' +
    fkm(x1) +
    '</text>' +
    '</svg>'
  );
}

  });
  document.body.append(back);
}

// --- GPX: eksport i import ---
function trkGPX(list, name, photoPath) {
  wpSyncAll();
  // GPX 1.1; dane OMM (warstwa, kolor, zdjęcia) w <extensions> – inne programy je pomijają
  const esc = x =>
      String(x == null ? '' : x).replace(
        /[<>&"]/g,
        c => ({'<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;'})[c]
      ),
    tm = (t, s) => (t.noTime ? '' : '<time>' + new Date(t.st + s * 1000).toISOString() + '</time>'),
    ph = u => (isLocalPh(u) ? (photoPath || 'zdjecia/') + u.slice(4) : u);
  let s =
    '<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="OMM – Own Map Manager" xmlns="http://www.topografix.com/GPX/1/1" xmlns:omm="https://github.com/OwnMapManager/omm">\n<metadata><name>' +
    esc(name) +
    '</name></metadata>\n';
  list.forEach(t => {
    (t.wp || []).forEach(w => {
      s +=
        '<wpt lat="' +
        w.p[0] +
        '" lon="' +
        w.p[1] +
        '">' +
        tm(t, w.s) +
        '<name>' +
        esc(w.nm || (w.n || w.i ? 'Punkt' : 'Zdjęcie')) +
        '</name>' +
        (w.n ? '<desc>' + esc(w.n) + '</desc>' : '') +
        (w.ph || []).map(u => '<link href="' + esc(ph(u)) + '"><type>image/jpeg</type></link>').join('') +
        '<extensions><omm:slad>' +
        esc(t.id) +
        '</omm:slad><omm:s>' +
        w.s +
        '</omm:s><omm:id>' +
        esc(w.id) +
        '</omm:id>' +
        (w.i ? '<omm:ikona>' + esc(w.i) + '</omm:ikona>' : '') +
        (w.ref ? '<omm:ref>' + esc(w.ref) + '</omm:ref>' : '') +
        '</extensions></wpt>\n';
    });
    const l = trkLayer(t);
    s +=
      '<trk><name>' +
      esc(t.nm) +
      '</name>' +
      (t.a ? '<type>' + ACT_GPX[t.a] + '</type>' : '') +
      '\n<extensions><omm:id>' +
      esc(t.id) +
      '</omm:id><omm:warstwa id="' +
      esc(l.id) +
      '">' +
      esc(l.name) +
      '</omm:warstwa>' +
      (t.c ? '<omm:kolor>' + t.c + '</omm:kolor>' : '') +
      (t.cm ? '<omm:kolorowanie>' + t.cm + '</omm:kolorowanie>' : '') +
      (t.vis === false ? '<omm:ukryty>1</omm:ukryty>' : '') +
      (t.noTime
        ? '<omm:bez_czasu>1</omm:bez_czasu><omm:start>' + new Date(t.st).toISOString() + '</omm:start>'
        : '') +
      '</extensions>\n';
    trkSegs(t).forEach(seg => {
      s += '<trkseg>\n';
      seg.forEach(q => {
        s +=
          '<trkpt lat="' +
          q[0] +
          '" lon="' +
          q[1] +
          '">' +
          (q[2] != null ? '<ele>' + q[2] + '</ele>' : '') +
          tm(t, q[3]) +
          '</trkpt>\n';
      });
      s += '</trkseg>\n';
    });
    s += '</trk>\n';
  });
  return s + '</gpx>\n';
}
function gpxTracks(text) {
  // ślady (trk), trasy (rte) i punkty (wpt) z pliku GPX → ślady OMM (z danymi OMM z <extensions>)
  const x = new DOMParser().parseFromString(text, 'application/xml');
  if (x.getElementsByTagName('parsererror').length) throw new Error('Plik GPX jest uszkodzony.');
  const out = [],
    kid = (el, n) => [...el.children].find(c => c.localName === n),
    ext = (el, n) => {
      const e = kid(el, 'extensions'),
        c = e && [...e.getElementsByTagName('*')].find(z => z.localName === n);
      return c ? c : null;
    };
  const make = (el, segs, tag) => {
    const pts = [],
      sg = [];
    let st = null;
    segs.forEach(seg => {
      const ps = [...seg.getElementsByTagName(tag)];
      if (!ps.length) return;
      if (pts.length) sg.push(pts.length);
      ps.forEach(p => {
        const la = +p.getAttribute('lat'),
          lo = +p.getAttribute('lon');
        if (!isFinite(la) || !isFinite(lo)) return;
        const e = kid(p, 'ele'),
          tm = kid(p, 'time'),
          ms = tm ? Date.parse(tm.textContent) : NaN;
        if (st == null && isFinite(ms)) st = ms;
        pts.push([
          +la.toFixed(6),
          +lo.toFixed(6),
          e && isFinite(+e.textContent) ? Math.round(+e.textContent * 10) / 10 : null,
          ms
        ]);
      });
    });
    if (pts.length < 2) return;
    const st0 = ext(el, 'start'),
      base = st != null ? st : (st0 && Date.parse(st0.textContent)) || Date.now();
    let prev = 0;
    pts.forEach(q => {
      q[3] = isFinite(q[3]) ? Math.max(prev, Math.round((q[3] - base) / 1000)) : prev;
      prev = q[3];
    });
    const nm = kid(el, 'name'),
      id = ext(el, 'id'),
      wl = ext(el, 'warstwa'),
      kol = ext(el, 'kolor');
    out.push({
      nm: nm ? nm.textContent.trim().slice(0, 200) : '',
      st: base,
      pts,
      sg,
      wp: [],
      ...(st == null ? {noTime: true} : {}),
      ...(id ? {_id: id.textContent.trim()} : {}),
      ...(wl ? {_l: wl.getAttribute('id') || '', _ln: wl.textContent.trim()} : {}),
      ...(kol && /^#[0-9a-f]{6}$/i.test(kol.textContent.trim()) ? {c: kol.textContent.trim()} : {}),
      ...(ext(el, 'kolorowanie') && RAMPS[ext(el, 'kolorowanie').textContent.trim()]
        ? {cm: ext(el, 'kolorowanie').textContent.trim()}
        : ext(el, 'kolorowanie') && ext(el, 'kolorowanie').textContent.trim() === 'jedn'
          ? {cm: 'jedn'}
          : {}),
      ...(ext(el, 'ukryty') ? {vis: false} : {}),
      ...(kid(el, 'type') && actFrom(kid(el, 'type').textContent) ? {a: actFrom(kid(el, 'type').textContent)} : {})
    });
  };
  [...x.getElementsByTagName('trk')].forEach(t => make(t, [...t.getElementsByTagName('trkseg')], 'trkpt'));
  [...x.getElementsByTagName('rte')].forEach(r => make(r, [r], 'rtept'));
  // punkty (wpt) przypinamy do śladu: z OMM – po identyfikatorze, z innych programów – do najbliższego w czasie
  [...x.getElementsByTagName('wpt')].forEach(p => {
    const la = +p.getAttribute('lat'),
      lo = +p.getAttribute('lon');
    if (!isFinite(la) || !isFinite(lo) || !out.length) return;
    const sid = ext(p, 'slad'),

// --- import śladów z innych formatów: KML/KMZ (Google, Moje Mapy), TCX (Garmin, Huawei, Polar), GeoJSON ---
function segsToTrk(nm, segs, extra) {
  // segs: [[szer, dł, wysokość|null, czas ms|NaN], …] na odcinek → ślad OMM (jak z GPX)
  const pts = [],
    sg = [];
  let st = null;
  segs.forEach(s => {
    const ok = s.filter(q => isFinite(q[0]) && isFinite(q[1]) && Math.abs(q[0]) <= 90 && Math.abs(q[1]) <= 180);
    if (!ok.length) return;
    if (pts.length) sg.push(pts.length);
    ok.forEach(q => {
      if (st == null && isFinite(q[3])) st = q[3];
      pts.push([+(+q[0]).toFixed(6), +(+q[1]).toFixed(6), q[2] != null && isFinite(q[2]) ? Math.round(q[2] * 10) / 10 : null, q[3]]);
    });
  });
  if (pts.length < 2) return null;
  const base = st != null ? st : Date.now();
  let prev = 0;
  pts.forEach(q => {
    q[3] = isFinite(q[3]) ? Math.max(prev, Math.round((q[3] - base) / 1000)) : prev;
    prev = q[3];
  });
  return {nm: (nm || '').trim().slice(0, 200), st: base, pts, sg, wp: [], ...(st == null ? {noTime: true} : {}), ...(extra || {})};
}
function kmlTracks(text) {
  // Placemark z gx:Track (czasy) albo LineString / MultiGeometry (bez czasów)
  const x = new DOMParser().parseFromString(text, 'application/xml');
  if (x.getElementsByTagName('parsererror').length) throw new Error('Plik KML jest uszkodzony.');
  const out = [],
    all = (el, n) => [...el.getElementsByTagName('*')].filter(c => c.localName === n),
    kid = (el, n) => [...el.children].find(c => c.localName === n);
  all(x, 'Placemark').forEach(pm => {
    const nm = kid(pm, 'name'),
      segs = [];
    all(pm, 'Track').forEach(tr => {
      const wh = all(tr, 'when').map(w => Date.parse(w.textContent)),
        co = all(tr, 'coord').map(c => c.textContent.trim().split(/\s+/).map(Number));
      segs.push(co.map((c, i) => [c[1], c[0], c.length > 2 ? c[2] : null, wh[i]]));
    });
    if (!segs.length)
      all(pm, 'LineString').forEach(ls => {
        const c = kid(ls, 'coordinates');
        if (c)
          segs.push(
            c.textContent
              .trim()
              .split(/\s+/)
              .map(p => p.split(',').map(Number))
              .map(v => [v[1], v[0], v.length > 2 && v[2] ? v[2] : null, NaN])
          );
      });
    const t = segs.length && segsToTrk(nm && nm.textContent, segs);
    if (t) out.push(t);
  });
  return out;
}
function tcxTracks(text) {
  // TCX: Activity (Sport) → Lap → Track → Trackpoint (Time, Position, AltitudeMeters)
  const x = new DOMParser().parseFromString(text, 'application/xml');
  if (x.getElementsByTagName('parsererror').length) throw new Error('Plik TCX jest uszkodzony.');
  const all = (el, n) => [...el.getElementsByTagName('*')].filter(c => c.localName === n),
    txt = (el, n) => {
      const c = all(el, n)[0];
      return c ? c.textContent : null;
    },
    out = [];
  all(x, 'Activity').forEach(ac => {
    const segs = all(ac, 'Track').map(tr =>
      all(tr, 'Trackpoint')
        .filter(p => all(p, 'Position').length)
        .map(p => [+txt(p, 'LatitudeDegrees'), +txt(p, 'LongitudeDegrees'), txt(p, 'AltitudeMeters') != null ? +txt(p, 'AltitudeMeters') : null, Date.parse(txt(p, 'Time'))])
    );
    const a = actFrom(ac.getAttribute('Sport')),
      t = segsToTrk(txt(ac, 'Notes') || '', segs, a && a !== 'inne' ? {a} : {});
    if (t) out.push(t);
  });
  return out;
}
function geojsonTracks(text) {
  // LineString / MultiLineString; czasy z properties.coordTimes (format z togeojson), jeśli są
  const j = JSON.parse(text),
    fs = j.type === 'FeatureCollection' ? j.features : j.type === 'Feature' ? [j] : [{type: 'Feature', geometry: j, properties: {}}],
    out = [];
  (fs || []).forEach(f => {
    const g = f && f.geometry,
      pr = (f && f.properties) || {};
    if (!g || isTrkFeature(f)) return;
    const lines = g.type === 'LineString' ? [g.coordinates] : g.type === 'MultiLineString' ? g.coordinates : [];
    if (!lines.length) return;
    const ct = pr.coordTimes || (pr.coordinateProperties && pr.coordinateProperties.times),
      tms = lines.length === 1 && Array.isArray(ct) && !Array.isArray(ct[0]) ? [ct] : Array.isArray(ct) ? ct : [];
    const t = segsToTrk(
      pr.name || pr.nazwa || '',
      lines.map((l, k) => l.map((c, i) => [c[1], c[0], c[2] != null ? c[2] : null, tms[k] ? Date.parse(tms[k][i]) : NaN]))
    );
    if (t) out.push(t);
  });
  return out;
}
async function trkParseFile(f) {
  // rozpoznanie formatu po rozszerzeniu albo po treści
  const n = f.name.toLowerCase(),
    text = /\.kmz$/.test(n) ? await fileText(f) : await f.text(),
    head = text.slice(0, 600);
  if (/\.tcx$/.test(n) || /<TrainingCenterDatabase/i.test(head)) return tcxTracks(text);
  if (/\.km[lz]$/.test(n) || /<kml/i.test(head)) return kmlTracks(text);
  if (/\.(geo)?json$/.test(n) || /^\s*[{[]/.test(head)) return geojsonTracks(text);
  if (/\.fit$/.test(n)) throw new Error('format FIT nie jest jeszcze obsługiwany – wyeksportuj ślad jako GPX lub TCX');
  return gpxTracks(text);
}
async function trkImport(files) {

        const {_id, _l, _ln, ...r} = t; // dane OMM z pliku (identyfikator, warstwa) pomijamy przy imporcie
        r.wp.forEach(

        );
        TRK.items.push({
          id: uid(),

          nm: r.nm || f.name.replace(/\.(gpx|kml|kmz|tcx|geojson|json)$/i, ''), // bez nazwy w pliku – nazwa pliku
          cr: Date.now(),
          up: Date.now()

        n++;

    } catch (e) {

    }

  if (n) {

    trkChanged();
    const last = TRK.items[TRK.items.length - 1];
    map.fitBounds(L.latLngBounds(last.pts.map(q => [q[0], q[1]])), {padding: [40, 40], maxZoom: 17});
  }
  tell(
    (n
      ? 'Dodano ' +
        n +
        ' ' +
        plural(n, 'ślad', 'ślady', 'śladów') +
        ' do warstwy „' +
        trkLayer({l: TRK.active}).name +
        '”.'
      : 'Nie dodano śladów.') +
      (dup ? '\n\nPominięto ' + dup + ' ' + plural(dup, 'ślad, który już jest', 'ślady, które już są', 'śladów, które już są') + ' w OMM.' : '') +
      (bad.length ? '\n\nNie udało się wczytać: ' + bad.join(', ') : '')
  );
}

// ---------- automatyczna nazwa śladu: data / rodzaj aktywności / miejsce (dzielnica, wieś) ----------
/*
 * Ustawienie „omm-trk-nazwa”: 'data' (domyślnie) | 'rodzaj' | 'miejsce' | 'oba'.
 * Miejsce: odwrotne geokodowanie OpenStreetMap Nominatim – wysyłane są TYLKO współrzędne startu
 * i mety, i tylko przy zapisie śladu (albo przy „Nadaj nazwy automatycznie”). Bez internetu ślad
 * dostaje nazwę bez miejsca (pole nmWait), a miejsce jest dopisywane, gdy wróci zasięg – o ile
 * nazwy nie zmieniono ręcznie (nazwa nadal równa nmAuto).
 */
const trkNameMode = () => localStorage.getItem('omm-trk-nazwa') || 'data',
  needPlace = m => m === 'miejsce' || m === 'oba';
const GEOC = new Map(); // pamięć odpowiedzi (współrzędne zaokrąglone do ~100 m)
let geoLast = 0;
async function placeAt(lat, lng) {
  // nazwa dzielnicy / wsi / miasta dla punktu albo null
  const key = lat.toFixed(3) + ',' + lng.toFixed(3);
  if (GEOC.has(key)) return GEOC.get(key);
  const wait = 1100 - (Date.now() - geoLast); // zasady Nominatim: najwyżej 1 zapytanie na sekundę
  if (wait > 0) await sleepMs(wait);
  geoLast = Date.now();
  const url =
    'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=pl&lat=' +
    lat.toFixed(5) +
    '&lon=' +
    lng.toFixed(5);
  let j = null;
  const H = plug('CapacitorHttp');
  if (H) {
    const r = await H.get({url, headers: {'User-Agent': 'OMM-OwnMapManager/' + APP_VER + ' (+https://github.com/OwnMapManager/omm)'}});
    j = typeof r.data === 'string' ? JSON.parse(r.data) : r.data;
  } else {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    j = await r.json();
  }
  const a = (j && j.address) || {},
    nm = a.suburb || a.quarter || a.city_district || a.village || a.hamlet || a.town || a.city || a.municipality || null;
  GEOC.set(key, nm);
  return nm;
}
async function trkPlaces(t) {

  const a = t.pts[0],
    b = t.pts[t.pts.length - 1];
  const p1 = await placeAt(a[0], a[1]),
    p2 = hav(a, b) > 300 ? await placeAt(b[0], b[1]) : p1;
  if (!p1 && !p2) return null;

}
function dayPart(ms) {

function trkAutoName(t, mode, place) {

async function trkFillPlaces() {
  // dopisanie miejsca do śladów zapisanych bez internetu (tylko gdy nazwy nie zmieniono ręcznie)
  const list = TRK.items.filter(t => t.nmWait);
  if (!list.length || !navigator.onLine) return;
  let ch = false;
  for (const t of list) {
    try {
      const pl = await trkPlaces(t);
      if (!pl) continue;
      if (t.nm === t.nmAuto) t.nm = t.nmAuto = trkAutoName(t, t.nmWait, pl);
      delete t.nmWait;
      t.up = Date.now();

  }

}

function periodRange(per, k) {
  // [od, do) w ms dla okresu przesuniętego o k (0 = bieżący, -1 = poprzedni…)
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  if (per === 'tydzien') {
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 7 * k); // od poniedziałku
    const e = new Date(d);
    e.setDate(e.getDate() + 7);
    return [d.getTime(), e.getTime()];
  }
  if (per === 'miesiac') {
    const a = new Date(d.getFullYear(), d.getMonth() + k, 1),
      b = new Date(d.getFullYear(), d.getMonth() + k + 1, 1);
    return [a.getTime(), b.getTime()];
  }
  if (per === 'rok') return [new Date(d.getFullYear() + k, 0, 1).getTime(), new Date(d.getFullYear() + k + 1, 0, 1).getTime()];
  return [-Infinity, Infinity];
}
function periodName(per, a, b) {
  const D = x => new Date(x);
  if (per === 'tydzien')
    return D(a).toLocaleDateString('pl-PL', {day: 'numeric', month: 'short'}) + ' – ' + D(b - 1).toLocaleDateString('pl-PL', {day: 'numeric', month: 'short', year: 'numeric'});
  if (per === 'miesiac') return D(a).toLocaleDateString('pl-PL', {month: 'long', year: 'numeric'});
  if (per === 'rok') return String(D(a).getFullYear());
  return 'Wszystkie ślady';
}

function trkFeatures() {
  // ślady jako obiekty GeoJSON: MultiLineString [dł, szer, wysokość], czasy w „czasy_s”
  return TRK.items.map(t => {
    const segs = trkSegs(t);
    return {
      type: 'Feature',
      geometry: {
        type: 'MultiLineString',
        coordinates: segs.map(s => s.map(q => (q[2] != null ? [q[1], q[0], q[2]] : [q[1], q[0]])))
      },
      properties: {
        sekcja: 'slady',
        typ: 'slad',
        id: t.id,
        nazwa: t.nm || '',
        warstwa: trkLayer(t).name,
        warstwa_id: t.l,
        ...(t.c ? {kolor: t.c} : {}),
        ...(t.cm ? {kolorowanie: t.cm} : {}),
        ...(t.vis === false ? {ukryty: true} : {}),
        ...(t.a ? {rodzaj: t.a} : {}),
        start: new Date(t.st).toISOString(),
        ...(t.noTime ? {bez_czasu: true} : {czasy_s: t.pts.map(q => q[3])}),
        utworzono: new Date(t.cr || t.st).toISOString(),
        zmieniono: new Date(t.up || t.cr || t.st).toISOString()

const isTrkFeature = f => !!(f && f.properties && f.properties.sekcja === 'slady');
function trkFromBackup(j) {
  // ślady z kopii; null = kopia bez śladów (np. starsza wersja) – wtedy obecne ślady zostają
  if (j.__trk !== undefined) return j.__trk; // kopia ZIP: ślady wczytane już z plików GPX
  const meta = (j.omm || {}).slady,
    feats = (j.features || []).filter(f => isTrkFeature(f) && f.geometry);
  if (!meta && !feats.length) return null;
  const T = {
    v: 1,
    active: meta && meta.aktywna,
    layers: ((meta && meta.warstwy) || []).map(l => ({
      id: l.id || uid(),
      name: l.name || 'Ślady',
      vis: l.vis !== false,
      c: /^#[0-9a-f]{6}$/i.test(l.c || '') ? l.c : '#e53935',
      open: !!l.open
    })),
    items: []
  };
  feats.forEach(f => {
    const pr = f.properties,
      g = f.geometry,
      segs = g.type === 'MultiLineString' ? g.coordinates : g.type === 'LineString' ? [g.coordinates] : [];
    const pts = [],
      sg = [],
      cz = Array.isArray(pr.czasy_s) ? pr.czasy_s : [];
    segs.forEach(s => {
      if (pts.length) sg.push(pts.length);
      s.forEach(c => pts.push([+c[1], +c[0], c[2] != null && isFinite(c[2]) ? +c[2] : null, 0]));
    });
    pts.forEach((q, i) => (q[3] = isFinite(cz[i]) ? +cz[i] : i ? pts[i - 1][3] : 0));
    let l = T.layers.find(x => x.id === pr.warstwa_id) || T.layers.find(x => x.name === pr.warstwa);
    if (!l)
      T.layers.push(
        (l = {
          id: pr.warstwa_id || uid(),
          name: pr.warstwa || 'Ślady z kopii',
          vis: true,
          c: '#e53935',
          open: false
        })
      );
    const st = Date.parse(pr.start);
    T.items.push({
      id: pr.id || uid(),
      l: l.id,
      nm: pr.nazwa || '',
      ...(/^#[0-9a-f]{6}$/i.test(pr.kolor || '') ? {c: pr.kolor} : {}),
      ...(['jedn', 'predkosc', 'wysokosc'].includes(pr.kolorowanie) ? {cm: pr.kolorowanie} : {}),
      ...(pr.ukryty ? {vis: false} : {}),
      ...(pr.bez_czasu ? {noTime: true} : {}),
      ...(ACTS[pr.rodzaj] ? {a: pr.rodzaj} : {}),
      st: isFinite(st) ? st : Date.now(),
      pts,
      sg,
      cr: Date.parse(pr.utworzono) || Date.now(),
      up: Date.parse(pr.zmieniono) || Date.now()

}

const recKF = {}; // filtr Kalmana „stała prędkość” (osobno oś wschód i północ, w metrach)
function kfStep(t, lat, lng, accu, time, speed, bearing) {
  // Filtr Kalmana „stała prędkość” (osobno oś wschód i północ, w metrach).
  // Korzysta z dwóch pomiarów GPS: położenia (dokładność ±accu m) i prędkości z efektu Dopplera
  // (speed m/s + kierunek bearing) – ta jest bardzo dokładna, więc filtr od razu „wie”, że auto stanęło
  // albo skręca: nie wyjeżdża za zakręt i nie robi zygzaków na postoju.
  const SA = 1.5, // dopuszczalne przyspieszenie (m/s²) – wystarcza dla pieszego, roweru i auta
    RV = 0.5 * 0.5, // niepewność prędkości z GPS (m/s)²
    my = 111320,
    mx = 111320 * Math.cos((lat * Math.PI) / 180),
    hasV = speed != null && isFinite(speed) && speed >= 0,
    vx = hasV
      ? speed > 0.3 && bearing != null && isFinite(bearing)
        ? speed * Math.sin((bearing * Math.PI) / 180)
        : 0
      : 0,
    vy = hasV
      ? speed > 0.3 && bearing != null && isFinite(bearing)
        ? speed * Math.cos((bearing * Math.PI) / 180)
        : 0
      : 0;
  if (!t.on || time - t.time > 30000) {
    Object.assign(t, {
      on: 1,
      la0: lat,
      lo0: lng,
      time,
      x: [0, vx],
      y: [0, vy],
      P: [
        [accu * accu, 0, 0, hasV ? RV : 25],
        [accu * accu, 0, 0, hasV ? RV : 25]
      ]
    });
    return [lat, lng];
  }
  const dt = Math.max(0.1, (time - t.time) / 1000),
    R = accu * accu,
    zx = (lng - t.lo0) * mx,
    zy = (lat - t.la0) * my,
    // manewr (zakręt, hamowanie): pomiar daleko od przewidywania – filtr na chwilę „luzuje”
    inn = Math.hypot(zx - (t.x[0] + t.x[1] * dt), zy - (t.y[0] + t.y[1] * dt)),
    q = (inn > 2.5 * accu ? Math.max(SA, 3) : SA) ** 2;
  [
    [t.x, zx, vx, 0],
    [t.y, zy, vy, 1]
  ].forEach(([s, z, zv, k]) => {
    // s = [położenie, prędkość], P = [p00, p01, p10, p11] – macierz niepewności
    let [a, b, c, d] = t.P[k];
    // przewidywanie
    s[0] += s[1] * dt;
    a = a + dt * (b + c) + dt * dt * d + (q * dt ** 4) / 4;
    b = b + dt * d + (q * dt ** 3) / 2;
    c = c + dt * d + (q * dt ** 3) / 2;
    d = d + q * dt * dt;
    // poprawka położeniem
    let S = a + R,
      k0 = a / S,
      k1 = c / S,
      e = z - s[0];
    s[0] += k0 * e;
    s[1] += k1 * e;
    [a, b, c, d] = [(1 - k0) * a, (1 - k0) * b, c - k1 * a, d - k1 * b];
    // poprawka prędkością z GPS
    if (hasV) {
      S = d + RV;
      k0 = b / S;
      k1 = d / S;
      e = zv - s[1];
      s[0] += k0 * e;
      s[1] += k1 * e;
      [a, b, c, d] = [a - k0 * c, b - k0 * d, c - k1 * c, d - k1 * d];
    }
    t.P[k] = [a, b, c, d];
  });
  t.time = time;
  return [t.la0 + t.y[0] / my, t.lo0 + t.x[0] / mx];
}
function recPoint(lat, lng, alt, accu, time, extra) {

    recFirst = false;
    map.setView([lat, lng], Math.max(map.getZoom(), 16));
  }

  }
  const newSeg = REC.sg.length && REC.sg[REC.sg.length - 1] === REC.pts.length;
  if (newSeg || !REC.pts.length) recKF.on = 0; // po pauzie filtr zaczyna od nowa

      Math.max(0, Math.round((time - REC.st) / 1000))

  if (last && !newSeg) {
    const d = hav(last, q),
      dt = q[3] - last[3];

    if (d < Math.max(P ? 3 : 8, accu * 0.5)) return recUi(); // postój – drgania pozycji w miejscu pomijamy
    // postój wg GPS (prędkość z efektu Dopplera): auto czeka na światłach / przepuszcza pieszego – bez nowych punktów
    if (x.speed != null && isFinite(x.speed) && x.speed < 0.5 && d < 15) return recUi();

    if (recKF.on && Math.hypot(recKF.x[1], recKF.y[1]) < 0.4 && d < 15) return recUi();
    if (d / dt > 60) return recUi(); // skok pozycji (ponad 200 km/h) – błąd GPS
    // auto-pauza: po postoju dłuższym niż 2 min ruszyliśmy – postój staje się przerwą w śladzie

  REC.pts.push(q);
  // „szpilka”: punkt B odskoczył i wrócił (A → B → C → D). Usuwamy B tylko, gdy po powrocie ślad
  // znów idzie w pierwotnym kierunku (zawrócenie przy B i ponownie przy C). Prawdziwe zawrócenie
  // – np. rowerem w drugą stronę – zostaje, bo po nim ślad dalej biegnie z powrotem.

    seg0 = REC.sg.length ? REC.sg[REC.sg.length - 1] : 0,
    turn = (a, b, c) => Math.abs(((brgDeg(b, c) - brgDeg(a, b) + 540) % 360) - 180);

    const [A, Bp, C, D] = REC.pts.slice(n - 4);

      hav(A, Bp) > 5 &&
      hav(Bp, C) > 5 &&
      hav(C, D) > 2 &&
      turn(A, Bp, C) > 135 &&
      turn(Bp, C, D) > 135 &&
      hav(A, C) < 0.5 * Math.min(hav(A, Bp), hav(Bp, C))

    const km = Math.floor(trkStats({pts: REC.pts, sg: REC.sg, st: REC.st}).d / 1000);

      REC.km = km;
      recKmSay(km);
    }

  recDraw();

}
async function recWatchOn() {
  const BG = plug('BackgroundGeolocation');
  if (BG) {
    // aplikacja na Androida: nagrywanie także przy wygaszonym ekranie
    try {
      const LN = plug('LocalNotifications'); // zgoda na powiadomienie „OMM nagrywa ślad” (Android 13+)
      if (LN) await LN.requestPermissions();
    } catch (e) {}
    try {
      recWatch = await BG.addWatcher(
        {
          backgroundTitle: 'OMM nagrywa ślad',
          backgroundMessage: 'Dotknij, aby wrócić do OMM. Nagrywanie zatrzymasz przyciskiem ⏹.',
          requestPermissions: true,
          stale: false,
          distanceFilter: recPrecise() ? 3 : 8
        },
        (loc, err) => {
          if (err) {
            if (err.code === 'NOT_AUTHORIZED') recNoPerm();
            return;
          }
          if (loc)
            recPoint(loc.latitude, loc.longitude, loc.altitude, loc.accuracy, loc.time || Date.now(), {
              speed: loc.speed,
              bearing: loc.bearing
            });
        }
      );
      return true;
    } catch (e) {
      tell('Nie udało się włączyć GPS: ' + ((e && e.message) || e));
      return false;
    }
  }
  if (!navigator.geolocation) {
    tell('Ta przeglądarka nie obsługuje GPS.');
    return false;
  }
  recWatch = navigator.geolocation.watchPosition(
    p =>
      recPoint(p.coords.latitude, p.coords.longitude, p.coords.altitude, p.coords.accuracy, p.timestamp, {
        speed: p.coords.speed,
        bearing: p.coords.heading
      }),
    err => {
      if (err.code === 1) recNoPerm(err);
    },
    {enableHighAccuracy: true, maximumAge: 0, timeout: 60000}
  );
  return true;
}
function recWatchOff() {
  if (recWatch == null) return;
  const BG = plug('BackgroundGeolocation');
  if (BG) BG.removeWatcher({id: recWatch}).catch(() => {});
  else navigator.geolocation.clearWatch(recWatch);
  recWatch = null;
}

function recPause(on) {
  if (!REC || !!REC.paused === on) return;
  REC.paused = on;
  if (on) {
    REC.pAt = Date.now();
    recWatchOff();
  } else {
    REC.pz += Date.now() - (REC.pAt || Date.now());
    delete REC.pAt;
    if (REC.pts.length) REC.sg.push(REC.pts.length); // po pauzie zaczyna się nowy odcinek
    recWatchOn();
  }
  recPersist(true);
  recUi();
}
async function recStop() {
  if (!REC) return;
  const was = REC.paused;
  recPause(true);
  if (REC.pts.length < 2) {
    const v = await dlg({
      title: 'Ślad ma za mało punktów – GPS nie ustalił jeszcze pozycji albo stoisz w miejscu.',
      btns: [
        {t: 'Zakończ bez zapisu', v: 'x', c: 'danger'},
        {t: 'Nagrywaj dalej', v: 'go', c: 'okb'}
      ]
    });
    if (v === 'x') recClear();
    else if (!was) recPause(false);
    return;
  }
  const r = await recSaveDlg();
  if (r === 'go') {
    if (!was) recPause(false);
    return;
  }
  if (r === 'x') {
    if (await askYes('Usunąć nagrany ślad bez zapisu?', 'Usuń', true)) recClear();
    else if (!was) recPause(false);
    return;
  }

    id: REC.id,

    nm: r.nm,

    ...(r.auto ? {nmAuto: r.auto} : {}),
    ...(r.wait ? {nmWait: r.wait} : {}),
    st: REC.st,
    pts: REC.pts,
    sg: REC.sg.filter(i => i > 0 && i < REC.pts.length),

/*
 * Zdjęcie dodane w OMM zapisuje się jako zmniejszona kopia (dłuższy bok ok. 2000 px, JPEG).
 * Oryginał zostaje w galerii telefonu (zdjęcie z aparatu OMM trafia też do galerii: Obrazy/OMM).
 * W danych obiektu zdjęcie to napis „omm:NAZWA.jpg” na liście ph (obok ewentualnych linków http).
 * Plik zdjęcia: IndexedDB „omm” → „foto/NAZWA.jpg” (działa też w przeglądarce),
 * a w aplikacji na Androida dodatkowo kopia w folderze OMM/zdjecia (do podejrzenia w telefonie).

const isLocalPh = u => typeof u === 'string' && /^omm:[\w.-]+$/.test(u);

async function fotoBlob(name) {
  try {
    return (await IDB.get('foto/' + name)) || null;
  } catch (e) {
    return null;
  }
}
async function fotoUrl(u) {
  // adres do wyświetlenia: link http bez zmian, zdjęcie z OMM – z pamięci aplikacji
  if (!isLocalPh(u)) return u;
  const n = u.slice(4);
  if (fotoCache.has(n)) return fotoCache.get(n);
  const b = await fotoBlob(n);
  if (!b) return '';

  fotoCache.set(n, url);

}

  im.referrerPolicy = 'no-referrer';

}

  const d = new Date(t || Date.now()),
    p = n => String(n).padStart(2, '0');
  return (
    d.getFullYear() +

async function fotoResize(file) {
  // zmniejszona kopia JPEG; obrót zgodnie z EXIF robi przeglądarka (imageOrientation)

// --- EXIF: lokalizacja i czas zrobienia zdjęcia (JPEG) ---
function exifInfo(buf) {
  const out = {};
  try {
    const dv = new DataView(buf);
    if (dv.getUint16(0) !== 0xffd8) return out; // nie JPEG
    let p = 2;
    while (p + 4 < dv.byteLength) {
      const mk = dv.getUint16(p),
        len = dv.getUint16(p + 2);
      if (mk === 0xffe1 && dv.getUint32(p + 4) === 0x45786966) {
        // „Exif”
        const t = p + 10,
          le = dv.getUint16(t) === 0x4949,
          u16 = o => dv.getUint16(t + o, le),
          u32 = o => dv.getUint32(t + o, le);
        const ifd = o => {
          // wpisy katalogu: {znacznik: [typ, liczba, przesunięcie wartości]}
          const n = u16(o),
            r = {};
          for (let i = 0; i < n; i++) {
            const e = o + 2 + i * 12;
            r[u16(e)] = [u16(e + 2), u32(e + 4), e + 8];
          }
          return r;
        };
        const str = ([ty, cnt, vo]) => {
          const o = cnt > 4 ? u32(vo) : vo;
          let s = '';
          for (let i = 0; i < cnt - 1; i++) s += String.fromCharCode(dv.getUint8(t + o + i));
          return s;
        };
        const rat = (o, k) => u32(o + k * 8) / (u32(o + k * 8 + 4) || 1);
        const i0 = ifd(u32(4));
        const timeOf = d => {
          const tm = d[0x9003] || d[0x0132];
          if (!tm) return;
          const m = str(tm).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
          if (m) out.time = new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime(); // czas lokalny telefonu
        };
        timeOf(i0);
        if (i0[0x8769]) timeOf(ifd(u32(i0[0x8769][2])));
        if (i0[0x8825]) {
          const g = ifd(u32(i0[0x8825][2]));
          if (g[2] && g[4]) {
            const dms = e => {
              const o = u32(e[2]);
              return rat(o, 0) + rat(o, 1) / 60 + rat(o, 2) / 3600;
            };
            let la = dms(g[2]),
              lo = dms(g[4]);
            if (g[1] && String.fromCharCode(dv.getUint8(t + g[1][2])) === 'S') la = -la;
            if (g[3] && String.fromCharCode(dv.getUint8(t + g[3][2])) === 'W') lo = -lo;
            if (isFinite(la) && isFinite(lo) && (la || lo) && Math.abs(la) <= 90 && Math.abs(lo) <= 180)
              out.ll = [+la.toFixed(6), +lo.toFixed(6)];
          }
        }
        return out;
      }
      if (mk === 0xffda) break; // początek danych obrazu – dalej nie ma EXIF
      p += 2 + len;
    }
  } catch (e) {}
  return out;
}

        by = TOP + (areaH - bh) / 2;

      cx.textAlign = 'center';
      cx.fillStyle = '#202124';
      cx.font = F('700', 38);
      cx.fillText((t.nm || 'Ślad').slice(0, Math.floor(bw / (20 * k))), W / 2, by + 70 * k);

      cx.font = F('700', 30);
      cx.fillStyle = '#1a73e8';

        cx.fillText(val + (un ? ' ' + un : ''), x, y + 46 * k);

async function filmRecord(t, speed, fmt, q, share) {

    return tell('To urządzenie nie potrafi nagrać filmu z animacji.');

    'video/mp4;codecs=avc1.42E01E',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ].find(x => MediaRecorder.isTypeSupported(x));
  if (!mime) return tell('To urządzenie nie potrafi nagrać filmu z animacji.');
  if (ANIM) {
    ANIM.playing = false;
    ANIM.ui.querySelector('.fbar button').textContent = '▶';
  }
  let cancel = false;
  const cb = h('div', 'dback'),
    box = h('div', 'dbox'),
    tx = h('div', 'dt', 'Przygotowuję film…');
  box.append(
    tx,
    B('Przerwij', () => (cancel = true))
  );
  cb.append(box);
  document.body.append(cb);
  const [W, H] = filmSize(fmt, q),
    eng = await filmEngine(t, W, H, (d, n) => (tx.textContent = 'Film: pobieram mapę ' + d + '/' + n + '…')),
    tl = animTimeline(eng.plan, speed),
    FPS = 30,
    N = Math.ceil((tl.T / 1000) * FPS),
    stream = eng.cv.captureStream(FPS),
    rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: q === '1080' ? 9e6 : 5e6}),
    chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(res => (rec.onstop = res));
  eng.frame(animState(tl, 0));
  rec.start(1000);
  // klatki w rytmie nagrywania – film trwa tyle, ile podgląd przy tej samej prędkości
  await new Promise(res => {
    let fi = 0;
    const iv = setInterval(() => {
      if (cancel || fi > N) {
        clearInterval(iv);
        return res();
      }
      eng.frame(animState(tl, (fi++ * 1000) / FPS));
      if (fi % 15 === 0) tx.textContent = 'Nagrywam film… ' + Math.min(100, Math.round((fi / N) * 100)) + '%';
    }, 1000 / FPS);
  });
  rec.stop();
  await done;
  cb.remove();
  if (cancel) return;
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm',
    blob = new Blob(chunks, {type: mime.split(';')[0]}),
    name = trkFile(t) + ' – animacja ' + FILM_FMT[fmt][2].split(' ')[1].replace(':', 'x') + '.' + ext;
  if (share) await shareOut(name, blob.type, blob);
  else await dl(name, blob.type, blob);
  if (eng.used === 'osm') tell('Wybrany podkład nie pozwala na nagranie, dlatego w filmie jest mapa OpenStreetMap.');
  if (eng.used === 'none') tell('Podkład nie pozwala na nagranie (albo brak internetu), dlatego film ma jasne tło bez mapy.');
}

  for (let k = 0, n = dv.getUint16(e + 10, true); k < n; k++) {
    const fl = dv.getUint16(p + 28, true);
    fs.set(td.decode(u8.subarray(p + 46, p + 46 + fl)), {
      meth: dv.getUint16(p + 10, true),
      csz: dv.getUint32(p + 20, true),
      off: dv.getUint32(p + 42, true)

    names: () => [...fs.keys()],
    has: n => fs.has(n),

    maps = [];

    maps.push((fc.omm && Array.isArray(fc.omm.maps) && fc.omm.maps[0]) || {id: mm.id, name: mm.name});

      v: 1,
      active: idx.slady.aktywna,
      layers: (idx.slady.warstwy || []).map(l => ({
        id: l.id || uid(),
        name: l.name || 'Ślady',
        vis: l.vis !== false,
        c: /^#[0-9a-f]{6}$/i.test(l.c || '') ? l.c : '#e53935',
        open: !!l.open
      })),
      items: []
    };
    for (const n of z.names().filter(x => /^slady\/.+\.gpx$/i.test(x)))
      gpxTracks(await txt(n)).forEach(t => {
        let l = trk.layers.find(x => x.id === t._l) || trk.layers.find(x => x.name === t._ln);
        if (!l)
          trk.layers.push(
            (l = {id: t._l || uid(), name: t._ln || 'Ślady z kopii', vis: true, c: '#e53935', open: false})
          );
        const {_id, _l, _ln, ...r} = t;
        r.wp.forEach(w => {
          if (w.ph) w.ph = fixPh(w.ph).filter(okPh);
          if (w.ph && !w.ph.length) delete w.ph;
        });
        trk.items.push({id: _id || uid(), l: l.id, ...r, cr: r.st, up: Date.now()});
      });
  }
  return {
    type: 'FeatureCollection',
    features: feats,
    omm: {
      format: 'omm-backup',
      formatVersion: 5,
      created: idx.created,
      cur: idx.cur,
      curW: idx.curW,
      maps,
      settings: z.has('ustawienia.json') ? JSON.parse(await txt('ustawienia.json')) : undefined,
      ...(idx.zakres ? {zakres: idx.zakres} : {})
    },
    __trk: trk // ślady wczytane z GPX (trkFromBackup je zwraca)
  };
}

// ---------- nawigacja do punktu: linia i odległość od mojej pozycji, strzałka wg kompasu ----------
const brgDeg = (a, b) => {
  // kierunek (azymut) z punktu a do b w stopniach od północy
  const r = Math.PI / 180,
    y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r),
    x =
      Math.cos(a[0] * r) * Math.sin(b[0] * r) -
      Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
};
const DIR8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
// --- wschód i zachód słońca (bez internetu) ---
function sunTimes(lat, lng, date) {
  // wschód i zachód słońca (równanie wschodu słońca, dokładność ~1–2 min); date – dowolna chwila tego dnia
  const r = Math.PI / 180,
    d = new Date(date || Date.now());
  d.setHours(12, 0, 0, 0); // południe lokalne – właściwa doba
  const J = d.getTime() / 864e5 + 2440587.5,
    n = Math.round(J - 2451545 + 0.0008),
    Js = n - lng / 360,
    M = (357.5291 + 0.98560028 * Js) % 360,
    C = 1.9148 * Math.sin(M * r) + 0.02 * Math.sin(2 * M * r) + 0.0003 * Math.sin(3 * M * r),
    lam = (M + C + 180 + 102.9372) % 360,
    Jt = 2451545 + Js + 0.0053 * Math.sin(M * r) - 0.0069 * Math.sin(2 * lam * r),
    sd = Math.sin(lam * r) * Math.sin(23.4397 * r),
    cd = Math.cos(Math.asin(sd)),
    cw = (Math.sin(-0.833 * r) - Math.sin(lat * r) * sd) / (Math.cos(lat * r) * cd),
    ms = j => new Date((j - 2440587.5) * 864e5);
  if (cw > 1) return {rise: null, set: null, polar: 'night', noon: ms(Jt)};
  if (cw < -1) return {rise: null, set: null, polar: 'day', noon: ms(Jt)};
  const w = Math.acos(cw) / r;
  return {rise: ms(Jt - w / 360), set: ms(Jt + w / 360), polar: null, noon: ms(Jt)};
}
const fhmin = ms => {
  // „2 h 13 min” / „40 min”
  const m = Math.max(0, Math.round(ms / 60000)),
    hh = Math.floor(m / 60);
  return (hh ? hh + ' h ' : '') + (m % 60) + ' min';
};
function sunLine(lat, lng) {
  // „☀ 6:55 – 18:03 · do zachodu 2:13”
  const s = sunTimes(lat, lng),
    now = Date.now();
  if (s.polar) return s.polar === 'day' ? '☀ słońce nie zachodzi' : '☀ słońce nie wschodzi';
  const left =
    now < s.rise ? ' · do wschodu ' + fhmin(s.rise - now) : now < s.set ? ' · do zachodu ' + fhmin(s.set - now) : ' · po zachodzie';
  return '☀ wschód ' + fhm(s.rise) + ' · zachód ' + fhm(s.set) + left;
}
const ARROW_SVG =
  '<svg viewBox="0 0 34 34" width="34" height="34"><circle cx="17" cy="17" r="15" fill="#1a73e8" opacity=".18"/><path d="M17 4L26 27L17 22L8 27Z" fill="#1a73e8" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
let NAV = null; // trwająca nawigacja: cel, pozycja, kierunek telefonu, elementy na mapie
function navStart(to, name, path) {

    })
  };

    const P = NAV.path,
      suf = new Array(P.length).fill(0);
    for (let i = P.length - 2; i >= 0; i--) suf[i] = suf[i + 1] + hav(P[i], P[i + 1]);
    NAV.suf = suf;
    NAV.line.setStyle({dashArray: null, weight: 6, opacity: 0.85}); // trasa po śladzie – linia ciągła
  }
