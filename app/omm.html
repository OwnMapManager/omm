}
function navPos(c) {
  if (!NAV) return;
  NAV.pos = [c.latitude, c.longitude];
  NAV.acc = c.accuracy;
  if (c.heading != null && isFinite(c.heading) && (c.speed || 0) > 0.7) NAV.gpsHead = c.heading;
  if (NAV.first) {
    NAV.first = false;
    NAV.me.addTo(NAV.g);
    NAV.lbl.addTo(NAV.g);
    map.fitBounds(L.latLngBounds([NAV.pos, NAV.to]), {
      paddingTopLeft: [40, 90],
      paddingBottomRight: [40, 80],
      maxZoom: 18
    });
  }
  navDraw();
}
function navDraw() {
  if (!NAV || !NAV.pos) return;
  let d = hav(NAV.pos, NAV.to),
    b = brgDeg(NAV.pos, NAV.to),
    off = 0;
  const hd = NAV.head != null ? NAV.head : NAV.gpsHead;
  if (NAV.path) {
    // po śladzie: najbliższy punkt trasy, reszta drogi po śladzie, strzałka na punkt ~40 m dalej
    const P = NAV.path;
    let j = 0,
      bd = Infinity;
    for (let i = 0; i < P.length; i++) {
      const x = hav(NAV.pos, P[i]);
      if (x < bd) {
        bd = x;
        j = i;
      }
    }
    let k = j,
      a = 0;
    while (k < P.length - 1 && a < 40) a += hav(P[k], P[++k]);
    off = bd;
    d = bd + NAV.suf[j];
    b = brgDeg(NAV.pos, P[k]);
    NAV.line.setLatLngs([NAV.pos, ...P.slice(j)]);
  } else NAV.line.setLatLngs([NAV.pos, NAV.to]);

  const ic = NAV.me.getElement && NAV.me.getElement();
  if (ic && ic.firstChild) ic.firstChild.style.transform = 'rotate(' + (hd != null ? hd : 0) + 'deg)';
  if (ic) ic.style.opacity = hd != null ? 1 : 0.7;
  NAV.lbl.setLatLng([(NAV.pos[0] + NAV.to[0]) / 2, (NAV.pos[1] + NAV.to[1]) / 2]);
  const le = NAV.lbl.getElement && NAV.lbl.getElement();
  if (le && le.firstChild) le.firstChild.textContent = fkm(d); // odległość na środku linii
  if (NAV.path) NAV.lbl.setLatLng(NAV.to);
  // strzałka na pasku: „tam” względem tego, gdzie patrzy telefon (bez kompasu – względem północy)
  NAV.arr.style.transform = 'rotate(' + (hd != null ? b - hd : b) + 'deg)';
  if (hav(NAV.pos, NAV.to) <= Math.max(8, Math.min(25, NAV.acc || 8))) {
    if (!NAV.arrived) {
      NAV.arrived = true;
      try {
        navigator.vibrate && navigator.vibrate([200, 100, 200]);
      } catch (e) {}
    }
    NAV.txt.textContent = '✅ Jesteś na miejscu: ' + NAV.name;
    return;
  }
  NAV.arrived = false;
  NAV.txt.textContent =
    NAV.name +
    ' · ' +
    fkm(d) +
    (NAV.path ? ' po śladzie' : '') +
    ' · ' +
    Math.round(b) +
    '° ' +
    DIR8[Math.round(b / 45) % 8] +
    (NAV.path && off > 40 ? ' · ⚠ ' + fkm(off) + ' od śladu' : '') +
    (NAV.acc > 30 ? ' · słaby GPS ±' + Math.round(NAV.acc) + ' m' : '');
}
async function trkNavAsk(t, rec) {

function navStop() {
  if (!NAV) return;
  if (NAV.watch != null) navigator.geolocation.clearWatch(NAV.watch);

// ---------- współrzędne punktu: okienko z kopiowaniem, udostępnianiem (SOS), odległością ode mnie i słońcem ----------
function myPosNow() {
  // ostatnia znana pozycja: nagrywanie, kropka GPS albo nawigacja
  if (REC && recPos && Date.now() - recPos.time < 60000) return [recPos.lat, recPos.lng];
  if (me && watching !== null) {
    const l = me.getLatLng();
    return [l.lat, l.lng];
  }
  if (NAV && NAV.pos) return NAV.pos;
  return null;
}
function getMyPos() {
  // pozycja teraz: znana od razu albo jednorazowy odczyt GPS
  const k = myPosNow();
  if (k) return Promise.resolve(k);
  if (!navigator.geolocation) return Promise.resolve(null);
  return new Promise(res =>
    navigator.geolocation.getCurrentPosition(
      x => res([x.coords.latitude, x.coords.longitude, x.coords.accuracy]),
      e => {
        if (e.code === 1) tell(gpsHelp(e));
        res(null);
      },
      {enableHighAccuracy: true, timeout: 45000, maximumAge: 10000}
    )
  );
}
const fdms = (v, p, n) => {
  // 51°46'12.3"N
  const a = Math.abs(v),
    d = Math.floor(a),
    m = Math.floor((a - d) * 60),
    s = ((a - d) * 60 - m) * 60;
  return d + '°' + String(m).padStart(2, '0') + "'" + s.toFixed(1).padStart(4, '0') + '"' + (v >= 0 ? p : n);
};
function coordShareText(c, title) {

    (title ? title + ': ' : '') +

    ', ' +

    '\n' +
    fdms(c[0], 'N', 'S') +
    ' ' +
    fdms(c[1], 'E', 'W') +
    '\nhttps://www.google.com/maps?q=' +
    la +
    ',' +
    lo +
    '\nhttps://www.openstreetmap.org/?mlat=' +
    la +
    '&mlon=' +
    lo +
    '#map=17/' +
    la +
    '/' +
    lo

}

async function shareOut(name, mime, data) {
  // w aplikacji: kopia w folderze OMM i systemowe okno „Udostępnij”; w przeglądarce: udostępnianie albo pobranie pliku
  const FS = plug('Filesystem');
  const opt = data instanceof Blob ? {data: await blob64(data)} : {data, encoding: 'utf8'};
  if (FS && plug('Share')) {
    try {
      const F = outFolder(mime, name);
      await FS.writeFile({path: F.base + '/' + name, directory: F.dir, recursive: true, ...opt});
    } catch (e) {}
    return shareNative(name, opt);
  }
  const file = new File([data instanceof Blob ? data : new Blob([data], {type: mime})], name, {type: mime});
  if (navigator.canShare && navigator.canShare({files: [file]}))
    try {
      return await navigator.share({files: [file], title: name});
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  dl(name, mime, data);
}

// margines (px) wokół śladu na obrazku – mały, żeby ślad wypełniał kadr
const TRK_IMG_MARGIN = 56;
function trkAspect(t) {
  // proporcje śladu (szerokość / wysokość) w rzucie mapy – do doboru wysokości obrazka
  const bb = L.latLngBounds(t.pts.map(q => [q[0], q[1]])),
    a = map.project(bb.getNorthWest(), 18),
    b = map.project(bb.getSouthEast(), 18);
  return Math.max(b.x - a.x, 1) / Math.max(b.y - a.y, 1);
}
async function trkMapCanvas(t, W, H, top, bot) {
  wpSyncAll();

  // podkład z kafli (gdy nie wolno – OpenStreetMap)
  const M = TRK_IMG_MARGIN,
    aw = W - 2 * M,
    ah = H - top - bot - 2 * M,
    bb = L.latLngBounds(t.pts.concat((t.wp || []).map(w => w.p)).map(q => [q[0], q[1]])),
    A = map.project(bb.getNorthWest(), 18),
    B = map.project(bb.getSouthEast(), 18);

    k = Math.pow(2, zf - z); // …przeskalowane o k (0,71–1,41)

    X0 = c.x - W / 2,
    Y0 = c.y - top - M - ah / 2,
    pr = q => {
      const p = map.project(L.latLng(q[0], q[1]), zf);
      return [p.x - X0, p.y - Y0];
    },
    cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const cx = cv.getContext('2d');

    cx.fillStyle = '#eef0f2';
    cx.fillRect(0, 0, W, H);
    if (l instanceof L.TileLayer) {
      // kafle rysujemy w natywnej skali na osobnym płótnie i skalujemy całość naraz (bez szczelin między kaflami)
      const tw = Math.ceil(W / k) + 2,

      tc.height = th;
      await drawTiles(
        tc.getContext('2d'),
        l,
        z,
        Math.floor(X0 / k),
        Math.floor(Y0 / k),
        tw,
        th,
        1,
        (d, n) => (info.textContent = 'Pobieram mapę ' + d + '/' + n + '…')
      );
      cx.imageSmoothingEnabled = true;
      cx.imageSmoothingQuality = 'high';

        oy = (Math.floor(Y0 / k) - Y0 / k) * k;
      cx.drawImage(tc, ox, oy, tw * k, th * k);

      return false;
    }

    P2 = t.pts.map(pr),
    path = () => {
      cx.beginPath();

    };

  path();
  cx.strokeStyle = 'rgba(255,255,255,.92)';
  cx.lineWidth = 15;
  cx.stroke();
  const g = trkModeOf(t) !== 'jedn' ? trkGrad(t, trkModeOf(t)) : null;
  if (g) {
    // każdy odcinek z gradientem od koloru jednego punktu do następnego – przejścia bez skoków
    cx.lineWidth = 8;
    for (let i = 1; i < P2.length; i++) {
      if (sg.has(i)) continue;
      const a = P2[i - 1],
        b = P2[i],
        gr = cx.createLinearGradient(a[0], a[1], b[0], b[1]);
      gr.addColorStop(0, rampColor(g.ramp, g.f[i - 1]));
      gr.addColorStop(1, rampColor(g.ramp, g.f[i]));

    cx.fillStyle = f;
    cx.fill();
    cx.lineWidth = 5;
    cx.strokeStyle = '#fff';
    cx.stroke();

  dot(P2[P2.length - 1], '#212121', 15);

    cx.fillStyle = '#fff';
    cx.shadowColor = 'rgba(0,0,0,.35)';

    cx.shadowBlur = 0;

}

function drawStatsBlock(cx, t, y, W) {
  // kafelki z liczbami (2 kolumny) i wykres wysokości; zwraca wysokość bloku
  const {s, tiles} = statsTiles(t),
    colW = (W - 80) / 2,
    rowH = 150;
  tiles.forEach(([v, u, lb], i) => {
    const x = 40 + (i % 2) * colW,
      yy = y + Math.floor(i / 2) * rowH;
    cx.textAlign = 'center';
    cx.fillStyle = '#202124';
    cx.font = '600 64px system-ui, sans-serif';
    const vw = cx.measureText(v).width;
    cx.font = '500 30px system-ui, sans-serif';
    const uw = u ? cx.measureText(' ' + u).width : 0,
      cxm = x + colW / 2 - uw / 2;

      cx.font = '500 30px system-ui, sans-serif';

      cx.textAlign = 'left';

    }

    cx.fillText(lb.toUpperCase(), x + colW / 2, yy + 120);
    cx.strokeStyle = '#e8eaed';
    cx.lineWidth = 2;
    cx.beginPath();
    cx.moveTo(x + 10, yy + rowH);
    cx.lineTo(x + colW - 10, yy + rowH);

  });

  let h = Math.ceil(tiles.length / 2) * rowH + 30;

  if (E.length > 1) {
    const gx = 110,
      gy = y + h + 50,
      gw = W - 150,

      e0 = Math.min(...E.map(x => x[1])),
      e1 = Math.max(e0 + 10, ...E.map(x => x[1])),
      d1 = E[E.length - 1][0] || 1,

    E.forEach((x, i) => (i ? cx.lineTo(X(x[0]), Y(x[1])) : cx.moveTo(X(x[0]), Y(x[1]))));

    cx.lineTo(gx, gy + gh);
    cx.closePath();
    cx.fillStyle = 'rgba(26,115,232,.14)';
    cx.fill();
    cx.beginPath();
    E.forEach((x, i) => (i ? cx.lineTo(X(x[0]), Y(x[1])) : cx.moveTo(X(x[0]), Y(x[1]))));
    cx.strokeStyle = '#1a73e8';
    cx.lineWidth = 4;
    cx.stroke();
    cx.font = '24px system-ui, sans-serif';
    cx.fillStyle = '#5f6368';
    cx.textAlign = 'right';
    cx.fillText(Math.round(e1) + ' m', gx - 12, gy + 10);
    cx.fillText(Math.round(e0) + ' m', gx - 12, gy + gh);
    cx.textAlign = 'left';
    cx.fillText('0', gx, gy + gh + 34);
    cx.textAlign = 'right';
    cx.fillText(fkm(d1), gx + gw, gy + gh + 34);
    cx.textAlign = 'start';
    h += 50 + gh + 60;
  }
  return h;
}

async function trkImage(t, kind) {

  }

  }

  // żeby ślad wypełniał kadr także przy trasach wąskich i wysokich
  const MI = 2 * TRK_IMG_MARGIN,
    MH = Math.round(Math.max(600, Math.min(1400, (W - MI) / trkAspect(t) + MI))),
    r = await trkMapCanvas(t, W, MH, 0, 0),

  cv.width = W;
  cv.height = 2600;
  const cx = cv.getContext('2d');
  cx.fillStyle = '#fff';
  cx.fillRect(0, 0, W, 2600);
  cx.drawImage(r.cv, 0, 0);
  drawHeader(cx, t, 0, MH, W, true);
  const h = drawStatsBlock(cx, t, MH + 170, W),
    H = MH + 170 + h + 110,
    out = document.createElement('canvas');

function trkCut(t, i) {

    mk = L.marker(t.pts[0].slice(0, 2), {

  const show = () => {

    const LA = trkSegs(A).map(s => s.map(q => [q[0], q[1]])),

    ca.setLatLngs([...LA, ...LB]);

    ba.setLatLng(A.pts[Math.floor(A.pts.length / 2)].slice(0, 2));
    bb.setLatLng(B.pts[Math.floor(B.pts.length / 2)].slice(0, 2));

    const part = (k, c, x) => {

  rg.oninput = show;
  const nearest = pt => {
    // miejsce na śladzie najbliższe punktowi na ekranie: odcinek oryginalnego śladu + ułamek (0–1)
    const P = T0.pts,
      sg = new Set(T0.sg || []);
    let best = null,
      bd = Infinity;
    for (let i = 0; i < P.length - 1; i++) {
      if (sg.has(i + 1)) continue; // przerwa (pauza) – tam nie ma linii
      const a = map.latLngToContainerPoint(P[i].slice(0, 2)),
        b = map.latLngToContainerPoint(P[i + 1].slice(0, 2)),
        dx = b.x - a.x,
        dy = b.y - a.y,
        L2 = dx * dx + dy * dy,
        u = L2 ? Math.max(0, Math.min(1, ((pt.x - a.x) * dx + (pt.y - a.y) * dy) / L2)) : 0,
        d = Math.hypot(a.x + u * dx - pt.x, a.y + u * dy - pt.y);

  const snapTo = r => {

    // nożyczki płynnie „przejeżdżają” z poprzedniego miejsca
    const from = mk.getLatLng(),
      P = T0.pts,
      sc = map.latLngToContainerPoint(P[r.i].slice(0, 2)).distanceTo(map.latLngToContainerPoint(P[r.i + 1].slice(0, 2))),
      px = r.u * sc; // odległość od punktu i na ekranie (px)
    let k;
    if (px < 3 || sc - px < 3) {
      setW(T0);
      k = px < 3 ? r.i : r.i + 1;
    } else {
      const a = P[r.i],
        b = P[r.i + 1],
        u = r.u,
        q = [
          +(a[0] + (b[0] - a[0]) * u).toFixed(6),
          +(a[1] + (b[1] - a[1]) * u).toFixed(6),
          a[2] != null && b[2] != null ? Math.round((a[2] + (b[2] - a[2]) * u) * 10) / 10 : a[2] != null ? a[2] : b[2],
          Math.round(a[3] + (b[3] - a[3]) * u)
        ];
      setW({
        ...T0,
        pts: [...P.slice(0, r.i + 1), q, ...P.slice(r.i + 1)],
        sg: (T0.sg || []).map(x => (x > r.i ? x + 1 : x))
      });
      k = r.i + 1;
    }
    rg.value = Math.min(n - 2, Math.max(1, k));
    show();
    const to = mk.getLatLng(),
      t0 = performance.now(),
      glide = now => {
        const u = Math.min(1, (now - t0) / 260),
          e = 1 - Math.pow(1 - u, 3);
        mk.setLatLng([from.lat + (to.lat - from.lat) * e, from.lng + (to.lng - from.lng) * e]);
        if (u < 1 && SPLIT) requestAnimationFrame(glide);
      };
    requestAnimationFrame(glide);
  };
  const drag = () => {
    const r = nearest(map.latLngToContainerPoint(mk.getLatLng()));
    if (r.i != null) snapTo(r);
  };
  mk.on('dragend', drag);
  mk.on('drag', () => {
    // w trakcie przeciągania – podgląd w najbliższym zapisanym punkcie
    const r = nearest(map.latLngToContainerPoint(mk.getLatLng()));
    if (r.i == null) return;
    setW(T0);
    const k = Math.min(n - 2, Math.max(1, r.u < 0.5 ? r.i : r.i + 1));
    if (k !== +rg.value) {
      rg.value = k;
      show();
    }
  });
  const finish = async kind => {
    const i = +rg.value,
      [A, B] = trkCut(W, i);
    if (
      kind !== 'both' &&
      !(await askYes(
        'Usunąć ' +
          (kind === 'del2' ? '2.' : '1.') +
          ' część śladu (' +
          fkm(trkStats(kind === 'del2' ? B : A).d) +
          ')?',
        'Usuń',
        true
      ))
    )
      return;
    const k = TRK.items.indexOf(t);
    if (k < 0) return splitStop();
    // zdjęcia z usuwanej części zostają w kopii aplikacji tylko, jeśli coś ich jeszcze używa
    const gone = kind === 'del2' ? B : kind === 'del1' ? A : null;
    if (gone) trashPut('slad', 'Odcięta część śladu „' + (t.nm || 'Ślad') + '”', {items: [{...gone, id: uid(), nm: (t.nm || 'Ślad') + ' – odcięta część'}]});
    if (kind === 'both') TRK.items.splice(k, 1, A, B);
    else if (kind === 'del2') TRK.items.splice(k, 1, A);
    else TRK.items.splice(k, 1, {...B, id: t.id, nm: t.nm});
    splitStop();
    trkChanged();

    del1 = B('', () => finish('del1'));
  del2.innerHTML = 'Usuń ' + splitDot(2, SPLIT_C2);
  del1.innerHTML = 'Usuń ' + splitDot(1, SPLIT_C1);
  del2.title = 'Usuń 2. część';
  del1.title = 'Usuń 1. część';
  bt.append(
    B('Zachowaj obie', () => finish('both'), 'okb'),
    del2,
    del1,
    B('Anuluj', splitStop)
  );
  ui.append(txt, rg, bt);
  document.body.append(ui);
  document.body.classList.add('spliton');
  // dotknięcie mapy przy śladzie ustawia miejsce podziału
  SPLIT.click = e => {
    // dotknięcie przy śladzie: nożyczki dokładnie w tym miejscu linii (także między punktami)
    const r = nearest(e.containerPoint);
    if (r.i != null && r.d < 40) snapTo(r);
  };
  map.on('click', SPLIT.click);
  map.fitBounds(L.latLngBounds(t.pts.map(q => [q[0], q[1]])), {
    paddingTopLeft: [30, 30],
    paddingBottomRight: [30, 200]
  });
  show();
}
function splitStop() {
  if (!SPLIT) return;
  map.off('click', SPLIT.click);
  SPLIT.g.remove();
  SPLIT.ui.remove();
  SPLIT = null;
  document.body.classList.remove('spliton');
}
const vehThr = () => {
  // próg „jazdy autem” z Ustawień (km/h); 0 = podpowiedź wyłączona
  const v = localStorage.getItem('omm-auto') || '40';
  return v === 'nie' ? 0 : +v || 40;
};
function vehicleCut(t) {
  // czy w śladzie jest jazda autem (wygładzona prędkość powyżej progu przez co najmniej 10 s)
  // po wolniejszej części? zwraca numer punktu „przy aucie” (ostatni postój przed jazdą) albo -1
  const thr = vehThr();
  if (!thr || t.noTime || t.pts.length < 10) return -1;
  const s = trkStatsC(t),
    P = t.pts,
    v = trkSpeeds(t),
    lim = thr / 3.6;
  if (!v) return -1;
  for (let i = 0; i < P.length; i++) {
    if (v[i] < lim) continue;
    let j = i;
    while (j < P.length - 1 && v[j + 1] >= lim * 0.8) j++; // chwilowe zwolnienie nie przerywa jazdy
    if (P[j][3] - P[i][3] < 10) {
      i = j;
      continue;
    }
    // jazda od i; przed nią musi być sensowna wolniejsza część
    if (s.cum[i] < 300) return -1;
    // cofamy się do początku rozpędzania (szybciej niż marsz), a potem najwyżej minutę do postoju przy aucie
    let k = i;
    while (k > 1 && v[k - 1] > 2.5 && P[i][3] - P[k - 1][3] < 300) k--;
    const k0 = k;
    while (k > 1 && v[k - 1] > 1 && P[k0][3] - P[k - 1][3] < 60) k--;
    return k;
  }
  return -1;
}
async function vehicleAsk(t) {
  const k = vehicleCut(t);
  if (k < 0) return;
  const [A, B] = trkCut(t, k),
    b = trkStats(B);
  const v = await dlg({
    title:
      'Od ' +
      fhm(t.st + t.pts[k][3] * 1000) +
      ' jechałeś chyba autem (średnio ' +
      fkmh(b.vavg) +
      ', ' +
      fkm(b.d) +
      ').\n\nOdciąć ten kawałek, żeby statystyki wycieczki były prawidłowe?',
    btns: [
      {t: 'Nie', v: null},
      {t: '✂ Pokaż i podziel', v: 1, c: 'okb'}
    ]
  });
  if (v) trkSplit(t, k);
}

// ---------- kosz: usunięte obiekty, warstwy, mapy i ślady – 30 dni na przywrócenie ----------
/*
 * TRASH = [{id, k: rodzaj, nm: opis, at: kiedy usunięto (ms), d: kopia danych, m?: id mapy, mn?: nazwa mapy}]
 *  k = 'obj' (obiekty mapy: d.items), 'warstwa' (d.l + d.items, d.g = id grupy), 'grupa' (d.g + d.items),
 *      'mapa' (d = cała mapa), 'slad' (d.items = ślady), 'twarstwa' (d.l = warstwa śladów + d.items)
 *  Zapis: IndexedDB „omm” → „kosz” (gdy niedostępna – localStorage „omm-kosz”). Po 30 dniach wpis znika,
 *  a zdjęcia, których nic już nie używa, są usuwane z pamięci aplikacji.
 */
const TRASH_DAYS = 30;
var TRASH = []; // (var: fotoUsed() sprawdza kosz także przed tym miejscem skryptu)
const clone = x => JSON.parse(JSON.stringify(x));
async function trashLoad() {
  try {
    TRASH = (await IDB.get('kosz')) || [];
  } catch (e) {
    try {
      TRASH = JSON.parse(localStorage.getItem('omm-kosz') || '[]');
    } catch (_) {}
  }
  if (!Array.isArray(TRASH)) TRASH = [];
  trashPurge();
}
function trashSave() {
  IDB.set('kosz', TRASH).catch(() => {
    try {
      localStorage.setItem('omm-kosz', JSON.stringify(TRASH));
    } catch (e) {}
  });
}
function trashPut(k, nm, d, extra) {
  TRASH.unshift({id: uid(), k, nm: String(nm || '').slice(0, 200), at: Date.now(), d: clone(d), ...(extra || {})});
  trashSave();
}
function trashPhotos(e) {
  // zdjęcia (nazwy „idb:…”) użyte w danych wpisu kosza
  const out = [],
    add = a => (a || []).forEach(x => isLocalPh(x) && out.push(x));
  const items = e.k === 'mapa' ? e.d.items || [] : e.d.items || [];
  items.forEach(i => {
    add(i.ph);
    (i.wp || []).forEach(w => add(w.ph));
  });
  return out;
}
function trashPurge() {
  const lim = Date.now() - TRASH_DAYS * 864e5,
    old = TRASH.filter(e => e.at < lim);
  if (!old.length) return;
  TRASH = TRASH.filter(e => e.at >= lim);
  trashSave();
  old.forEach(e => trashPhotos(e).forEach(fotoForget)); // tylko gdy nic innego już ich nie używa
}
const mapLayers = m => (m.groups || []).flatMap(g => g.layers.map(l => ({g, l})));
function trashRestore(e) {
  // przywraca wpis tam, skąd został usunięty (gdy tego miejsca już nie ma – do bieżącej mapy / aktywnej warstwy)
  const fresh = (list, have) =>
    list.forEach(x => {
      if (have(x.id)) x.id = uid();
    });
  let msg = '';
  if (e.k === 'slad' || e.k === 'twarstwa') {
    const d = clone(e.d);
    if (e.k === 'twarstwa') {
      if (TRK.layers.some(l => l.id === d.l.id)) d.l.id = uid();
      d.items.forEach(t => (t.l = d.l.id));
      TRK.layers.push(d.l);
    } else d.items.forEach(t => TRK.layers.some(l => l.id === t.l) || (t.l = TRK.active));
    fresh(d.items, id => TRK.items.some(t => t.id === id));
    TRK.items.push(...d.items);
    trkFix();
    trkChanged();
    msg = 'Przywrócono do śladów GPS.';
  } else if (e.k === 'mapa') {
    const m = clone(e.d);
    if (DB.maps.some(x => x.id === m.id)) m.id = uid();
    DB.maps.push(m);
    save();
    msg = 'Przywrócono mapę „' + m.name + '”' + (!!m.w !== isW() ? ' (jest w trybie ' + (m.w ? 'pracy' : 'prywatnym') + ')' : '') + '.';
  } else {
    const m = DB.maps.find(x => x.id === e.m) || P,
      d = clone(e.d),
      have = id => DB.maps.some(mm => mm.items.some(i => i.id === id));
    if (e.k === 'warstwa' || e.k === 'grupa') {
      const ls = e.k === 'grupa' ? d.g.layers : [d.l];
      ls.forEach(l => {
        if (mapLayers(m).some(x => x.l.id === l.id)) {
          const nid = uid();
          d.items.forEach(i => i.l === l.id && (i.l = nid));
          l.id = nid;
        }
      });
      if (e.k === 'grupa') {
        if (m.groups.some(g => g.id === d.g.id)) d.g.id = uid();
        m.groups.push(d.g);
      } else (m.groups.find(g => g.id === d.gid) || m.groups[0]).layers.push(d.l);
    } else {
      const ls = mapLayers(m),
        def = (ls.find(x => x.l.id === m.active) || ls[0]).l.id;
      d.items.forEach(i => ls.some(x => x.l.id === i.l) || (i.l = def));
    }
    fresh(d.items, have);
    m.items.push(...d.items);
    save();
    msg = 'Przywrócono na mapę „' + m.name + '”' + (m !== P ? ' – otwórz ją, by zobaczyć' : '') + '.';
  }
  TRASH = TRASH.filter(x => x !== e);
  trashSave();
  render();
  sheetIfOpen();
  return msg;
}
const TRASH_IC = {obj: '📍', warstwa: '🗂', grupa: '🗂', mapa: '🗺', slad: '〰️', twarstwa: '🗂'};

    }, 'danger'),
    B('Zamknij', fin, 'okb')
  );
  box.append(body, bt);

  draw();
}

// ---------- wyszukiwarka: obiekty map, ślady, współrzędne, adresy (internet) ----------
function parseCoords(s) {
  // „51.77, 19.46”, „51,77 19,46”, „N 51°46'12" E 19°27'36"”, „51°46.2'N 19°27.6'E”
  s = String(s).trim().replace(/[′’]/g, "'").replace(/[″”]/g, '"');
  // ułamki dziesiętne z przecinkiem: „51,77 19,46” (sprawdzamy najpierw – przecinek nie jest tu separatorem)
  const dc = s.match(/^(-?\d{1,2},\d+)[\s;]+(-?\d{1,3},\d+)$/);
  if (dc) s = dc[1].replace(',', '.') + ' ' + dc[2].replace(',', '.');
  let m = s.match(/^([NS])?\s*(-?\d{1,2}(?:[.,]\d+)?)\s*[°\s]?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*'?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*"?)?)?\s*([NS])?[\s,;]+([EW])?\s*(-?\d{1,3}(?:[.,]\d+)?)\s*[°\s]?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*'?\s*(?:(\d{1,2}(?:[.,]\d+)?)\s*"?)?)?\s*([EW])?$/i);
  if (!m) {
    // ułamki dziesiętne z przecinkiem: „51,77 19,46”
    const d = s.match(/^(-?\d{1,2},\d+)\s+(-?\d{1,3},\d+)$/);
    if (!d) return null;
    m = [null, null, d[1], null, null, null, null, d[2], null, null, null];
  }
  const num = x => (x == null ? 0 : +String(x).replace(',', '.')),
    dms = (a, b, c) => Math.abs(num(a)) + num(b) / 60 + num(c) / 3600,
    la = dms(m[2], m[3], m[4]) * (/s/i.test(m[1] || m[5] || '') || num(m[2]) < 0 ? -1 : 1),
    lo = dms(m[7], m[8], m[9]) * (/w/i.test(m[6] || m[10] || '') || num(m[7]) < 0 ? -1 : 1);

async function offDownload(a) {

        const k = offKey(a.src, z, x, y);
        if (OFF.idx.has(k)) continue; // już jest (np. z innego obszaru)
        const c = L.point(x, y);
        c.z = z;
        keys.push(k);
        urls.push(layer.getTileUrl(c));
      }

  layer._tileZoom = old;

    if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); // Android nie usunie danych przy braku miejsca
  } catch (e) {}

    tx = h('span'),
    job = (OFFJOB = {stop: false, bar});

  document.body.append(bar);

  };

    Array.from({length: src.par}, async () => {

          bytes += b.size;

          ok++;
          if (buf.length >= 25) await flush();

        ? 'Pobieranie przerwane. Pobrano ' + ok + ' kafli (' + fmb(bytes) + ') – zostają w telefonie.'
        : '✅ Obszar „' + a.nm + '” jest w telefonie: ' + fmb(bytes) + (bad ? ', nie udało się pobrać ' + bad + ' kafli' : '') + '.\n\nBez internetu mapa pokaże go automatycznie (podkład „' + src.name + '”).'

}
async function offDelete(a) {

}

// ---------- automatyczna kopia zapasowa: lokalnie (7 ostatnich) i na Dysk Google (jeden nadpisywany plik) ----------
/*
 * Częstotliwość „omm-autokopia”: 'zamk' (przy każdym zamknięciu), 'dzien' (domyślnie), 'tydz', 'nie'.
 * Kopia robi się, gdy aplikacja jest zamykana / chowana, a gdy nie zdąży – przy następnym uruchomieniu.
 * Lokalnie: <folder z Ustawień>/kopie/omm-autokopia-RRRR-MM-DD-GGMM.zip, zostaje 7 najnowszych.
 * Dysk Google: jeden plik wybrany raz w systemowym oknie „Zapisz w…” („omm-dysk-uri”), nadpisywany
 * natywną wtyczką OmmBackup. Stan ostatniej kopii: „omm-autokopia-stan”.
 */
const AB_MODES = {zamk: 0, dzien: 20 * 3600e3, tydz: 6.5 * 864e5};
const abMode = () => localStorage.getItem('omm-autokopia') || 'dzien',
  abState = () => {
    try {
      return JSON.parse(localStorage.getItem('omm-autokopia-stan') || '{}');
    } catch (e) {
      return {};
    }
  };
let abBusy = false;
function abDue() {
  const m = abMode();
  return m !== 'nie' && Date.now() - (abState().at || 0) >= AB_MODES[m];
}
async function autoBackup(force) {
  // force = „Zrób kopię teraz”; bez force – tylko gdy minęło dość czasu
  if (abBusy || (!force && (!NATIVE || !abDue()))) return null;
  abBusy = true;
  const st = {at: Date.now(), local: false, drive: null, err: ''};
  try {
    const blob = await zipBackup(false);
    if (!NATIVE) {
      dl('omm-kopia-' + dateStamp() + '.zip', 'application/zip', blob); // w przeglądarce: zwykłe pobranie pliku
      st.local = true;
    } else {
      const FS = plug('Filesystem'),
        data = await blob64(blob),
        F = outFolder('application/zip', 'omm-kopia');
      try {
        await FS.writeFile({path: F.base + '/omm-autokopia-' + dateStamp() + '.zip', directory: F.dir, recursive: true, data});
        st.local = true;
        // zostaje 7 najnowszych autokopii (ręczne kopie omm-kopia-* nie są ruszane)
        const ls = await FS.readdir({path: F.base, directory: F.dir}),
          old = (ls.files || [])
            .map(x => (typeof x === 'string' ? x : x.name))
            .filter(n => /^omm-autokopia-.*\.zip$/.test(n))
            .sort();
        while (old.length > 7) await FS.deleteFile({path: F.base + '/' + old.shift(), directory: F.dir});
      } catch (e) {
        st.err = 'lokalnie: ' + ((e && e.message) || e);
      }
      const du = localStorage.getItem('omm-dysk-uri'),
        OB = plug('OmmBackup');
      if (du && OB) {
        try {
          const c = await FS.writeFile({path: 'autokopia/OMM-kopia.zip', directory: 'CACHE', recursive: true, data});
          await OB.writeTo({uri: du, src: c.uri});
          st.drive = true;
          FS.deleteFile({path: 'autokopia/OMM-kopia.zip', directory: 'CACHE'}).catch(() => {});
        } catch (e) {
          st.drive = false;
          st.err += (st.err ? ' · ' : '') + 'Dysk: ' + ((e && e.message) || e);
        }
      }
    }
  } catch (e) {
    st.err = (e && e.message) || String(e);
  }
  abBusy = false;
  if (st.local || st.drive) localStorage.setItem('omm-autokopia-stan', JSON.stringify(st));
  toastMsg(st.local || st.drive ? '✅ Kopia zapisana' + (st.drive ? ' (także na Dysku)' : '') : '⚠ Kopia nie udała się');
  return st;
}
const dateStamp = () => {
  const d = new Date(),
    p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
};
function abStatusText() {
  const s = abState();

  const d = new Date(s.at),
    today = new Date().toDateString() === d.toDateString();
  return (
    'Ostatnia kopia: ' +
    (today ? 'dziś ' : fday(s.at) + ' ') +

async function abPickDrive() {

  const OB = plug('OmmBackup');
  if (!OB) return tell('Kopia na Dysk Google działa w aplikacji OMM na Androidzie.');

// kopia przy zamykaniu / chowaniu aplikacji, a gdy nie zdążyła – po uruchomieniu
if (plug('App')) {
  plug('App').addListener('pause', () => autoBackup(false));
  plug('App').addListener('resume', () => setTimeout(() => autoBackup(false), 8000));
}
setTimeout(() => autoBackup(false), 12000);

// ---------- ustawienia aplikacji (folder zapisu, nagrywanie śladu) ----------
function settingsDlg() {
  // ustawienia w zwijanych kategoriach; otwarta kategoria zapamiętana
  const back = h('div', 'dback'),
    box = h('div', 'dbox about'),
    body = h('div', 'abody'),
    bt = h('div', 'db');
  let sec = body; // bieżąca kategoria (radios dopisuje do niej)
  const cat = (key, title) => {
    const d = h('details', 'scat'),
      s = h('summary', null, title);
    d.open = localStorage.getItem('omm-set-open') === key;
    d.addEventListener('toggle', () => {
      if (d.open) {
        localStorage.setItem('omm-set-open', key);
        body.querySelectorAll('details.scat').forEach(x => x !== d && (x.open = false)); // jedna otwarta naraz
      }
    });
    d.append(s);
    body.append(d);
    sec = h('div', 'scb');
    d.append(sec);
  };
  // grupa przycisków wyboru zapisywana w localStorage pod kluczem key
  const radios = (title, key, def, opts, note, onSet) => {
    const g = h('div', 'sset'),
      cur = localStorage.getItem(key) || def;
    g.append(h('b', null, title));
    opts.forEach(([v, t]) => {
      const lb = h('label'),
        r = h('input');
      r.type = 'radio';
      r.name = key;
      r.checked = v === cur;
      r.onchange = () => {
        localStorage.setItem(key, v);
        if (onSet) onSet(v);
      };
      lb.append(r, h('span', null, t));
      g.append(lb);
    });
    if (note) g.append(h('div', 'muted', note));
    sec.append(g);
  };
  const btnRow = list => {
    const r = h('div', 'setop');
    r.append(...list);
    sec.append(r);
  };
  box.append(h('div', 'dt', '⚙️ Ustawienia'));

  cat('rec', '🔴 Nagrywanie śladu');
  radios('Dokładność zapisu', 'omm-rec-tryb', 'dokladny', [
    ['dokladny', 'Dokładne – punkt co ~2 s w ruchu (jak Geo Tracker)'],
    ['oszczedny', 'Oszczędne – punkt co ~5 s / 8 m, mniejsze zużycie baterii']
  ]);
  radios(
    'Auto-pauza przy postoju',
    'omm-rec-ap',
    'tak',
    [
      ['tak', 'Włączona – postój dłuższy niż 2 min nie liczy się do czasu śladu'],
      ['nie', 'Wyłączona – czas liczy się także na postojach']
    ],
    'Po ruszeniu nagrywanie samo wraca do zwykłego trybu; na pasku widać wtedy „Auto-pauza”.'
  );
  radios(
    'Komunikat co 1 km',
    'omm-rec-km',
    'nie',
    [
      ['nie', 'Wyłączony'],
      ['pow', 'Wibracja i powiadomienie (dystans, czas, tempo lub prędkość)'],
      ['glos', 'Jak wyżej + komunikat głosowy']
    ],
    'Działa także przy wygaszonym ekranie. Głos czyta syntezator mowy telefonu (polski głos musi być zainstalowany).'
  );
  radios(
    'Nazwa nowego śladu',
    'omm-trk-nazwa',
    'data',
    [
      ['data', 'Data i godzina – „Ślad pt., 9.10.2026 06:32”'],
      ['rodzaj', 'Rodzaj aktywności – „Rower · pt., 9.10 rano”'],
      ['miejsce', 'Miejsce – „Bałuty → Widzew · pt., 9.10”'],
      ['oba', 'Rodzaj + miejsce – „Rower · Bałuty → Widzew”']
    ],
    'Miejsce (dzielnicę, wieś, miasto) podaje OpenStreetMap: przy zapisie śladu OMM wysyła tam współrzędne startu i mety – nic więcej. Bez internetu miejsce dopisze się, gdy wróci zasięg. Nazwę zawsze można zmienić przed zapisem; stare ślady: zaznacz na liście → Nazwy.'
  );
  radios(
    'Podpowiedź „przesiadka do auta”',
    'omm-auto',
    '40',
    [
      ['nie', 'Wyłączona'],
      ['30', 'Od 30 km/h'],
      ['40', 'Od 40 km/h'],
      ['50', 'Od 50 km/h (rower szybko zjeżdża z górki)'],
      ['60', 'Od 60 km/h']
    ],
    'Po zakończeniu nagrania OMM sprawdza, czy przez co najmniej 10 s jechałeś szybciej niż próg – wtedy proponuje odcięcie jazdy autem, żeby statystyki wycieczki były prawidłowe.'
  );

  cat('trk', '〰️ Ślady na mapie');
  radios(
    'Kolor śladów (domyślny)',
    'omm-trk-kolor',
    'jedn',
    [
      ['jedn', 'Jednolity – kolor śladu lub jego warstwy'],
      ['predkosc', 'Wg prędkości – od czerwonego (wolno) do zielonego (szybko)'],
      ['wysokosc', 'Wg wysokości – od niebieskiego (nisko) do czerwonego (wysoko)']
    ],
    'Dotyczy śladów na mapie, nagrywanego śladu i obrazków do udostępnienia. Pojedynczy ślad może mieć własny wybór – dotknij jego kolorowego szlaczka na liście śladów.',
    () => trkRender()
  );

  cat('pliki', '📁 Foldery i pliki');
  radios(
    'Folder zapisu (kopie, eksporty)',
    'omm-folder',
    'docs',
    [
      ['docs', FOLDERS.docs.label],
      ['down', FOLDERS.down.label]
    ],
    NATIVE
      ? 'Pliki trafiają do podfolderów: kopie, eksport, wydruki, filmy, zdjecia. Po każdym zapisie można też plik „Udostępnić…” – np. na Dysk Google.'
      : 'Dotyczy aplikacji na Androida. W przeglądarce pliki trafiają do folderu pobranych plików.'
  );
  radios('Wydruki i obrazy (PNG)', 'omm-folder-png', 'same', [
    ['same', 'Do tego samego folderu'],
    ['pics', FOLDERS.pics.label + ' – widoczne w galerii zdjęć']
  ]);

  cat('dane', '🗂 Kopia zapasowa i dane');
  radios(
    'Automatyczna kopia',
    'omm-autokopia',
    'dzien',
    [
      ['zamk', 'Przy każdym zamknięciu aplikacji'],
      ['dzien', 'Raz dziennie (przy zamknięciu)'],
      ['tydz', 'Raz w tygodniu (przy zamknięciu)'],
      ['nie', 'Wyłączona']
    ],
    NATIVE
      ? 'Pełna kopia ZIP (mapy, ślady, zdjęcia, ustawienia) w ' + outFolder('application/zip', 'omm-kopia').label + ' – zostaje 7 ostatnich. Po zapisie pojawia się komunikat „Kopia zapisana”.'
      : 'Automatyczna kopia działa w aplikacji na Androida. Tutaj „Zrób kopię teraz” pobiera plik ZIP.'
  );
  {
    const g = h('div', 'sset'),
      du = localStorage.getItem('omm-dysk-uri');
    g.append(h('b', null, 'Dysk Google'));
    g.append(
      h(
        'div',
        'muted',
        du
          ? 'Kopia nadpisuje plik „' + (localStorage.getItem('omm-dysk-nazwa') || 'OMM-kopia.zip') + '” w wybranym miejscu – zawsze najnowsza wersja.'
          : 'Nie wybrano. Wskaż raz plik na Dysku Google, a OMM będzie go sam nadpisywał najnowszą kopią (wysyła aplikacja Dysk, także po powrocie zasięgu).'
      )
    );
    const r = h('div', 'setop');
    r.append(
      B(du ? 'Zmień miejsce…' : 'Wybierz miejsce na Dysku…', () => {
        back.remove();
        abPickDrive();
      }),
      ...(du
        ? [
            B('Odłącz', () => {
              localStorage.removeItem('omm-dysk-uri');
              localStorage.removeItem('omm-dysk-nazwa');
              back.remove();
              settingsDlg();
            })
          ]
        : [])
    );
    g.append(r);
    sec.append(g);
    const st = h('div', 'sset');
    st.append(h('b', null, 'Stan'), h('div', 'muted abst', abStatusText()));
    const go = BI('save', 'Zrób kopię teraz', async () => {
      go.disabled = true;
      await autoBackup(true);
      st.querySelector('.abst').textContent = abStatusText();
      go.disabled = false;
    });
    const gr = h('div', 'setop');
    gr.append(go);
    st.append(gr);
    sec.append(st);
  }
  sec.append(h('div', 'muted', 'Usunięte punkty, warstwy, mapy i ślady czekają w koszu 30 dni.'));
  btnRow([
    BI('del', 'Kosz (' + TRASH.length + ')', () => {
      back.remove();
      trashDlg();
    })
  ]);

  cat('app', 'ℹ️ Aplikacja');
  const tut = B('📘 Samouczek', () => {}, '', 'Samouczek pojawi się w kolejnych wersjach');
  tut.disabled = true;
  btnRow([
    B('ℹ️ O aplikacji i jak zacząć', () => {
      back.remove();
      aboutDlg();
    }),
    tut
  ]);
  sec.append(h('div', 'muted', APP_NAME + ' ' + APP_VER + ' – ' + APP_FULL));

  const fin = () => back.remove();
  bt.append(B('Zamknij', fin, 'okb'));
  box.append(body, bt);
  back.append(box);
  back.addEventListener('click', e => {
    if (e.target === back) fin();
  });
  document.body.append(back);
}

// ---------- aplikacja na Androida: przycisk „Wstecz” ----------
// Zamiast od razu zamykać aplikację, „Wstecz” cofa się krok po kroku:
// okno dialogowe → menu → panel warstw → dymek obiektu → tryb rysowania → zminimalizowanie OMM.
if (plug('App'))
  plug('App').addListener('backButton', () => {
    const dialogs = document.querySelectorAll('.dback');
    if (dialogs.length) {
      // kliknięcie w tło okna = „Anuluj” (tak samo jak palcem obok okna)
      dialogs[dialogs.length - 1].dispatchEvent(new MouseEvent('click', {bubbles: true}));
      return;
    }
    if (['bmenu', 'xmenu', 'dmenu'].some(i => $(i).style.display === 'block')) return closePops();
    if ($('sheet').style.display === 'flex')
      return TSEL && TAB === 'slady' ? $('tsx').click() : $('closes').click(); // najpierw wyjście z zaznaczania
    if (map._popup && map.hasLayer(map._popup)) return map.closePopup();
    if (ANIM) return animStop();
    if (NAV) return navStop();
    if (SPLIT) return splitStop();
    if ($('recpan').style.display === 'block') return $('rectx').click();
    if (mode) return setMode(null);
    plug('App').minimizeApp();
  });
</script></body></html>
